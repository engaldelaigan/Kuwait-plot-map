        icon: L.divIcon({ className: "parcel-label", html: String(num), iconSize: null }),
      }).addTo(parcelLabels);
    }
  }
  map.on("zoomend", updateParcelLabels);

  // Deselect: hides the panel, the red outline and the side numbers.
  function clearSelection() {
    sideLabels.clearLayers();
    if (selectedOutline) { map.removeLayer(selectedOutline); selectedOutline = null; }
    panelEl.classList.remove("visible");
    panelEl.innerHTML = "";
    selectedProps = null;
    selectedLayer = null;
  }

  function showSideLabels(props, layer) {
    sideLabels.clearLayers();
    if (selectedOutline) { map.removeLayer(selectedOutline); selectedOutline = null; }
    if (layer) {
      selectedOutline = L.polyline(layer.getLatLngs()[0].concat([layer.getLatLngs()[0][0]]), {
        color: "#c0392b", weight: 3, opacity: 0.95,
      }).addTo(map);
    }
    for (const s of props.sides) {
      if (!s.mid) continue;
      L.marker(s.mid, {
        interactive: false,
        icon: L.divIcon({ className: "side-num", html: String(s.n), iconSize: [20, 20] }),
      }).addTo(sideLabels);
    }
  }

  // A self-contained SVG of the parcel with numbered, dimensioned edges --
  // drawn from the projected geometry so it prints without needing map tiles.
  function buildPlotSvg(geomWgs, sides, setbacks) {
    const lonlat = geomWgs?.coordinates?.[0];
    if (!lonlat) return "";
    // Project to local metres so the drawing has true proportions (a degree of
    // longitude is much shorter than a degree of latitude at this latitude).
    const lat0 = lonlat[0][1];
    const kx = mPerDegLon(lat0), ky = mPerDegLat(lat0);
    // The SAME simplified ring the side lengths come from. Indexing the raw
    // ring here put every label on the wrong edge whenever simplification had
    // merged a redundant vertex, which is most plots.
    const simple = simplifyRing(lonlat);
    // Shifted to a local origin. Absolute metres put the viewBox at ~4.6
    // million with a ~40-unit viewport, and renderers rasterise in single
    // precision, where that quantises to about half a metre -- enough to
    // visibly deform a house plot.
    const ox0 = lonlat[0][0] * kx, oy0 = lat0 * ky;
    const ring = simple.map(([lon, lat]) => [lon * kx - ox0, lat * ky - oy0]);
    const xs = ring.map((p) => p[0]);
    const ys = ring.map((p) => p[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs);
    const miny = Math.min(...ys), maxy = Math.max(...ys);
    const w = maxx - minx || 1;
    const h = maxy - miny || 1;
    const pad = Math.max(w, h) * 0.22;
    const flipY = (y) => miny + maxy - y; // SVG y grows downward
    const pts = ring.map(([x, y]) => `${x},${flipY(y)}`).join(" ");
    const fs = Math.max(w, h) / 16;

    const labels = sides
      .map((s, i) => {
        const [x1, y1] = ring[i];
        const [x2, y2] = ring[i + 1];
        const mx = (x1 + x2) / 2;
        const my = flipY((y1 + y2) / 2);
        const cx = (minx + maxx) / 2;
        const cy = flipY((miny + maxy) / 2);
        // Nudge the label outward from the centre so it clears the edge.
        const dx = mx - cx, dy = my - cy;
        const len = Math.hypot(dx, dy) || 1;
        const ox = mx + (dx / len) * fs * 1.1;
        const oy = my + (dy / len) * fs * 1.1;
        // Third line, in the kerb colour, only where a street actually faces
        // this side -- on most plots that is one or two of the four.
        const sb = setbacks?.get(s.n);
        const sbText = sb == null ? "" :
          `<text x="${ox}" y="${oy + fs * 1.75}" font-size="${fs * 0.66}" text-anchor="middle" dominant-baseline="middle" fill="#c0392b">${sb.toFixed(2)} m</text>`;
        return `<text x="${ox}" y="${oy}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="#17211b">${s.n}</text>
                <text x="${ox}" y="${oy + fs}" font-size="${fs * 0.72}" text-anchor="middle" dominant-baseline="middle" fill="#5b6b60">${fmtSide(s.length).replace("&mdash;", "—")}</text>${sbText}`;
      })
      .join("");

    return `<svg viewBox="${minx - pad} ${miny - pad} ${w + 2 * pad} ${h + 2 * pad}" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-height:340px">
      <polygon points="${pts}" fill="#e8efe6" stroke="#3c6e47" stroke-width="${Math.max(w, h) / 220}" />
      ${labels}
    </svg>`;
  }

  // ---- Printed map -------------------------------------------------------
  // The plain outline was hard to place on the ground, so the sheet now prints
  // the plot over the same basemap the user is looking at, at a zoom chosen to
  // fit, with the plot centred. Built from tile <img>s positioned by Leaflet's
  // own projection, so the overlay lines up exactly with the imagery.
  const PRINT_W = 620, PRINT_H = 430, TILE = 256;

  function printMapPlan(geomWgs) {
    const lonlat = geomWgs?.coordinates?.[0];
    if (!lonlat) return null;
    const bounds = L.latLngBounds(lonlat.map(([lon, lat]) => L.latLng(lat, lon)));
    const centre = bounds.getCenter();

    // Largest zoom where the plot plus a margin still fits the printed box.
    let zoom = 19;
    for (; zoom > 13; zoom--) {
      const a = map.project(bounds.getNorthWest(), zoom);
      const b = map.project(bounds.getSouthEast(), zoom);
      if (Math.abs(b.x - a.x) <= PRINT_W * 0.62 && Math.abs(b.y - a.y) <= PRINT_H * 0.62) break;
    }

    const mid = map.project(centre, zoom);
    const originX = mid.x - PRINT_W / 2;
    const originY = mid.y - PRINT_H / 2;
    const toPx = (lon, lat) => {
      const p = map.project(L.latLng(lat, lon), zoom);
      return [p.x - originX, p.y - originY];
    };

    const sat = map.hasLayer(satellite);
    const urls = [];
    const x0 = Math.floor(originX / TILE), x1 = Math.floor((originX + PRINT_W) / TILE);
    const y0 = Math.floor(originY / TILE), y1 = Math.floor((originY + PRINT_H) / TILE);
    const max = Math.pow(2, zoom);
    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= max) continue;
        const wx = ((tx % max) + max) % max; // wrap at the date line
        const url = sat
          ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ty}/${wx}`
          : `https://${"abc"[(wx + ty) % 3]}.tile.openstreetmap.org/${zoom}/${wx}/${ty}.png`;
        urls.push({ url, left: tx * TILE - originX, top: ty * TILE - originY });
      }
    }
    return { zoom, toPx, urls, sat };
  }

  // Metres per printed pixel, for the scale bar.
  function printScaleBar(zoom, lat) {
    const mPerPx = (156543.03392 * Math.cos((lat * Math.PI) / 180)) / Math.pow(2, zoom);
    // A round number of metres that lands near 110 px.
    const nice = [5, 10, 20, 25, 50, 100, 200];
    let metres = nice[0];
    for (const n of nice) if (n / mPerPx <= 130) metres = n;
    return { metres, px: metres / mPerPx };
  }

  let selectedProps = null;
  let selectedLayer = null;

  function showPanel(props, layer) {
    selectedProps = props;
    selectedLayer = layer;
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    const nbh = pick(props.neighborhood_ar, props.neighborhood_en);
    const street = pick(props.street_ar, props.street_en);
    const title = pick(props.title_ar, props.title_en);
    const sidesHtml = props.sides.length
      ? `<dd class="sides-list" style="font-weight:400;">${props.sides
          .map((s) => `<b>${s.n}</b> &mdash; ${fmtSide(s.length)}`)
          .join("<br>")}</dd>`
      : "<dd>&mdash;</dd>";
    // Worth saying how many there are when the list is scrolled: otherwise a
    // 93-sided parcel looks like a handful of sides that stop abruptly.
    const sidesLabel =
      props.sides.length > 6
        ? `${t("sides")} <span class="sides-count">(${props.sides.length})</span>`
        : t("sides");
    // Each label/value pair is wrapped so the two-column mobile layout can't
    // strand a value in the other column from its label.
    const row = (label, value) => `<div><dt>${label}</dt><dd>${value}</dd></div>`;
    panelEl.innerHTML =
      row(t("parcel"), props.parcel_no ?? "&mdash;") +
      row(t("block"), props.block_no ?? "&mdash;") +
      row(t("street"), street ?? "&mdash;") +
      row(t("house"), props.house_no ?? "&mdash;") +
      row(t("neighborhood"), nbh ?? "&mdash;") +
      (title ? row(t("title"), title) : "") +
      // Official area from the municipality; the value computed from the
      // polygon is only a fallback where they publish none, because a derived
      // 1000.1 against a recorded 1000 reads as an error.
      row(t("area"), fmtNum(props.measured_area ?? props.computed_area, "m&sup2;")) +
      // Filled in below: it needs a round trip, and the panel should not wait.
      `<div><dt>${t("setback")}</dt><dd id="setbackVal">…</dd></div>` +
      `<div><dt>${sidesLabel}</dt>${sidesHtml}</div>` +
      `<dd style="margin-top:10px;"><button id="printBtn" type="button">${t("print")}</button></dd>`;
    panelEl.classList.add("visible");
    showSideLabels(props, layer);
    document.getElementById("printBtn").addEventListener("click", () => printPlot(props));
    loadSetback(props.global_id);
    // With الارتداد switched on, selecting a plot draws its setbacks straight
    // away -- the point of leaving the mode on is not having to press the
    // button again for every plot.
    if (setbackMode) autoSetback();
  }

  // Distance from the plot to the nearest paved road, measured against the
  // municipality's own road-edge polygons. This is the figure their KME Guide
  // reports, and the one people actually want -- not the distance to a
  // centreline, which is half a carriageway longer.
  //
  // Sequenced so a slow reply for a previously selected plot cannot land in the
  // panel of the one now open.
  let setbackSeq = 0;
  async function loadSetback(gis) {
    const seq = ++setbackSeq;
    const el = () => document.getElementById("setbackVal");
    if (!gis) { if (el()) el().innerHTML = "&mdash;"; return; }
    let rows = [];
    try {
      rows = await api(`rpc/plot_setback?gis=${encodeURIComponent(gis)}`);
    } catch {
      if (seq === setbackSeq && el()) el().innerHTML = "&mdash;";
      return;
    }
    if (seq !== setbackSeq) return;
    const target = el();
    if (!target) return;
    const m = rows?.[0]?.metres;
    // No road within 60 m means the lookup found nothing, not a setback of 0.
    target.innerHTML = m == null ? "&mdash;" : `${Number(m).toFixed(1)} m`;
  }

  // Whatever is currently drawn on the map -- automatic setbacks and any the
  // user placed by hand -- so the sheet shows the measurements they actually
  // took, not just the ones the algorithm would pick.
  function drawnMeasurements() {
    const out = [];
    measurements.eachLayer((pair) => {
      let line = null, text = null;
      pair.eachLayer((l) => {
        if (l.getLatLngs) line = l;
        else if (l.getContent) text = l.getContent();
      });
      if (!line) return;
      const ll = line.getLatLngs();
      if (ll.length < 2) return;
      out.push({
        from: ll[0],
        to: ll[ll.length - 1],
        text: String(text ?? "").replace(/&mdash;/g, "—").replace(/<[^>]*>/g, ""),
      });
    });
    return out;
  }

  // The plot drawn over the basemap, in printed-pixel space.
  function buildPrintMap(props, setbacks) {
    const plan = printMapPlan(props.geom);
    if (!plan) return null;
    const { toPx, urls, zoom } = plan;

    const imgs = urls
      .map((tl) => `<img src="${tl.url}" style="left:${tl.left}px; top:${tl.top}px" crossorigin="anonymous" />`)
      .join("");

    const simple = simplifyRing(props.geom.coordinates[0]);
    const px = simple.map(([lon, lat]) => toPx(lon, lat));
    const pts = px.map((p) => `${p[0]},${p[1]}`).join(" ");
    let cx = 0, cy = 0;
    for (let i = 0; i < px.length - 1; i++) { cx += px[i][0]; cy += px[i][1]; }
    cx /= px.length - 1; cy /= px.length - 1;

    // Side number and length, pushed outward from the centre so they sit clear
    // of the boundary rather than on top of it.
    const sideLabels = (props.sides ?? [])
      .map((s, i) => {
        if (!px[i] || !px[i + 1]) return "";
        const mx = (px[i][0] + px[i + 1][0]) / 2;
        const my = (px[i][1] + px[i + 1][1]) / 2;
        const dx = mx - cx, dy = my - cy;
        const len = Math.hypot(dx, dy) || 1;
        const lx = mx + (dx / len) * 22, ly = my + (dy / len) * 22;
        const sb = setbacks?.get(s.n);
        return `<g text-anchor="middle">
          <text x="${lx}" y="${ly}" font-size="13" font-weight="700" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${s.n}</text>
          <text x="${lx}" y="${ly + 13}" font-size="11" fill="#1d2b22" stroke="#fff" stroke-width="3" paint-order="stroke">${fmtSide(s.length).replace("&mdash;", "—")}</text>
          ${sb == null ? "" : `<text x="${lx}" y="${ly + 26}" font-size="10.5" font-weight="700" fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">${sb.toFixed(2)} m</text>`}
        </g>`;
      })
      .join("");

    // The measurements as drawn, in the same red as on screen.
    const drawn = drawnMeasurements()
      .map((m) => {
        const [ax, ay] = toPx(m.from.lng, m.from.lat);
        const [bx, by] = toPx(m.to.lng, m.to.lat);
        return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#c0392b" stroke-width="2.5" />
          <circle cx="${ax}" cy="${ay}" r="2.8" fill="#c0392b" />
          <circle cx="${bx}" cy="${by}" r="2.8" fill="#c0392b" />
          <text x="${(ax + bx) / 2}" y="${(ay + by) / 2 - 6}" font-size="11" font-weight="700" text-anchor="middle"
                fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">${m.text}</text>`;
      })
      .join("");

    const bar = printScaleBar(zoom, L.latLngBounds(props.geom.coordinates[0].map(([lo, la]) => L.latLng(la, lo))).getCenter().lat);
    const by0 = PRINT_H - 16;

    return `<div class="plan">${imgs}
      <svg viewBox="0 0 ${PRINT_W} ${PRINT_H}" xmlns="http://www.w3.org/2000/svg">
        <polygon points="${pts}" fill="rgba(60,110,71,0.18)" stroke="#2f5d3a" stroke-width="2.5" />
        ${sideLabels}
        ${drawn}
        <g transform="translate(${PRINT_W - 34},26)">
          <path d="M0,-16 L6,8 L0,3 L-6,8 Z" fill="#17211b" stroke="#fff" stroke-width="1.5" paint-order="stroke" />
          <text y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${t("north")}</text>
        </g>
        <g transform="translate(14,${by0})">
          <line x1="0" y1="0" x2="${bar.px}" y2="0" stroke="#17211b" stroke-width="3" />
          <line x1="0" y1="-5" x2="0" y2="5" stroke="#17211b" stroke-width="3" />
          <line x1="${bar.px}" y1="-5" x2="${bar.px}" y2="5" stroke="#17211b" stroke-width="3" />
          <text x="${bar.px / 2}" y="-9" font-size="11" font-weight="700" text-anchor="middle" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${bar.metres} m</text>
        </g>
      </svg>
      <span class="attrib">${plan.sat ? "Imagery © Esri" : "© OpenStreetMap"}</span>
    </div>`;
  }

  // Chrome will happily print before tiles arrive, so wait for them (briefly --
  // a slow tile server must not block the dialog indefinitely).
  function preloadTiles(urls, timeoutMs = 7000) {
    return Promise.race([
      Promise.all(urls.map((u) => new Promise((res) => {
        const im = new Image();
        im.onload = im.onerror = res;
        im.src = u;
      }))),
      new Promise((res) => setTimeout(res, timeoutMs)),
    ]);
  }

  async function printPlot(props) {
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    const nbh = pick(props.neighborhood_ar, props.neighborhood_en);
    const street = pick(props.street_ar, props.street_en);
    // Setbacks are computed here rather than read off whatever happens to be
    // drawn, so a printout is complete even if nothing was measured on screen.
    // They need the kerb layer, so zoomed out they are simply absent.
    const ctx = setbackContext();
    const setbacks = new Map();
    if (ctx) {
      for (const s of sideSetbacks(props, ctx)) {
        if (s.metres != null) setbacks.set(s.n, s.metres);
      }
    }
    const rows = props.sides
      .map((s) => {
        const sb = setbacks.get(s.n);
        return `<tr><td>${s.n}</td><td>${fmtSide(s.length)}</td><td>${sb == null ? "—" : sb.toFixed(2) + " m"}</td></tr>`;
      })
      .join("");

    const plan = printMapPlan(props.geom);
    const planHtml = plan ? buildPrintMap(props, setbacks) : `<div class="diagram">${buildPlotSvg(props.geom, props.sides, setbacks)}</div>`;

    document.getElementById("printArea").innerHTML = `
      <h1>${t("parcel")} ${props.parcel_no ?? ""} &mdash; ${t("block")} ${props.block_no ?? ""}</h1>
      <p class="sub">${[nbh, street].filter(Boolean).join(" &mdash; ")}</p>
      <table class="meta">
        <tr><th>${t("parcel")}</th><td>${props.parcel_no ?? "—"}</td><th>${t("block")}</th><td>${props.block_no ?? "—"}</td></tr>
        <tr><th>${t("neighborhood")}</th><td>${nbh ?? "—"}</td><th>${t("street")}</th><td>${street ?? "—"}</td></tr>
        <tr><th>${t("house")}</th><td>${props.house_no ?? "—"}</td><th>${t("area")}</th><td>${props.measured_area ?? "—"} m²</td></tr>
      </table>
      ${planHtml}
      <table class="sides"><thead><tr><th>${t("side")}</th><th>${t("length")}</th><th>${t("setbackCol")}</th></tr></thead><tbody>${rows}</tbody></table>
      ${ctx ? "" : `<p class="note">${t("setbackUnavailable")}</p>`}
      <p class="foot">${t("source")}. ${t("printed")}: ${new Date().toLocaleString(lang === "ar" ? "ar-KW" : "en-GB")}.</p>
    `;
    if (plan) await preloadTiles(plan.urls.map((u) => u.url));
    window.print();
  }

  const PLOT_LIMIT = 1000;
  let plotLayer = null;

  function rowsToFeatures(rows) {
    return rows
      .filter((r) => r.geom)
      .map((r) => ({
        type: "Feature",
        geometry: r.geom,
        properties: {
          global_id: r.global_id,
          parcel_no: r.parcel_no,
          paci_no: r.paci_no,
          block_no: r.block_no,
          neighborhood_ar: r.neighborhood_ar,
          neighborhood_en: r.neighborhood_en,
          measured_area: r.measured_area,
          shape_area: r.shape_area,
          shape_length: r.shape_length,
          geom: r.geom,
          house_no: r.house_no,
          street_ar: r.street_ar,
          street_en: r.street_en,
          title_ar: r.title_ar,
          title_en: r.title_en,
          computed_area: computeAreaM2(r.geom),
          sides: computeSideDetails(r.geom),
        },
      }));
  }

  // Renders a fresh set of plots, replacing whatever was shown before, and
  // rebuilds the ruler's snap targets to match. Plot snap targets are rebuilt
  // (not appended) so stale geometry from a previous area can't be snapped to.
  function renderPlots(features, { highlightGlobalId = null } = {}) {
    if (plotLayer) map.removeLayer(plotLayer);
    snapVerts.length = 0;
    for (let i = snapSegs.length - 1; i >= 0; i--) {
      if (snapSegs[i].kind === "plot") snapSegs.splice(i, 1);
    }
    for (const f of features) {
      const ring = f.geometry?.coordinates?.[0];
      if (!ring) continue;
      for (let i = 0; i < ring.length - 1; i++) {
        snapVerts.push({ p: ring[i], kind: "plot" });
        snapSegs.push({ a: ring[i], b: ring[i + 1], kind: "plot" });
      }
    }

    let matched = null;
    plotLayer = L.geoJSON(
      { type: "FeatureCollection", features },
      {
        style: { color: "#3c6e47", weight: 1, fillColor: "#a9c9ab", fillOpacity: 0.45 },
        onEachFeature: (feature, lyr) => {
          if (highlightGlobalId && feature.properties.global_id === highlightGlobalId) {
            matched = { feature, lyr };
          }
          lyr.on("click", () => {
            plotJustClicked = true;
            if (!measuring) showPanel(feature.properties, lyr);
          });
          lyr.on("mouseover", () => lyr.setStyle({ fillOpacity: 0.75 }));
          lyr.on("mouseout", () => lyr.setStyle({ fillOpacity: 0.45 }));
        },
      }
    ).addTo(map);

    labelledFeatures = features;
    updateParcelLabels();

    if (matched) showPanel(matched.feature.properties, matched.lyr);
    return plotLayer;
  }

  const PLOT_COLS =
    "global_id,parcel_no,paci_no,block_no,neighborhood_ar,neighborhood_en,measured_area,shape_length,house_no,street_ar,street_en,title_ar,title_en,geom";

  async function api(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase query failed: ${res.status} ${res.statusText}`);
    return res.json();
  }

  // ---- Sign-in -----------------------------------------------------------
  // The area report is owner-only. The real gate is the database grant --
  // area_report is executable by `authenticated` and revoked from `anon` -- so
  // a signed-out visitor gets 401 from the endpoint whatever the page does.
  // Hiding the button is a convenience, not the lock: the key is in the page
  // source and anyone can call the API directly.
  let session = null; // { access_token, refresh_token, email }

  function loadSession() {
    try {
      const raw = storage.get("kwplots-session");
      session = raw ? JSON.parse(raw) : null;
    } catch { session = null; }
    return session;
  }
  function saveSession(s) {
    session = s;
    if (s) storage.set("kwplots-session", JSON.stringify(s));
    else storage.set("kwplots-session", "");
    applyAuthUi();
  }

  async function signIn(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error_description || body.msg || `HTTP ${res.status}`);
    saveSession({
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      email: body.user?.email ?? email,
    });
  }

  // Access tokens expire after an hour, so a session restored from a previous
  // visit is usually stale. Refreshing on 401 keeps the user signed in instead
  // of bouncing them to the login form mid-measurement.
  async function refreshSession() {
    if (!session?.refresh_token) return false;
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) { saveSession(null); return false; }
    const body = await res.json();
    saveSession({
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      email: body.user?.email ?? session.email,
    });
    return true;
  }

  // POST to an RPC as the signed-in user, retrying once after a refresh.
  async function authRpc(fn, payload, retried = false) {
    if (!session) throw new Error("not signed in");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: {
        apikey: ANON_KEY,
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    });
    if (res.status === 401 && !retried && (await refreshSession())) {
      return authRpc(fn, payload, true);
    }
    if (!res.ok) throw new Error(`${fn} failed: ${res.status}`);
    return res.json();
  }

  // Loads only what's inside the current view, via the PostGIS bbox function.
  async function loadPlotsInView({ highlightGlobalId = null } = {}) {
    const b = map.getBounds();
    const rows = await api(
      `rpc/plots_in_bbox?min_lon=${b.getWest()}&min_lat=${b.getSouth()}` +
        `&max_lon=${b.getEast()}&max_lat=${b.getNorth()}&max_rows=${PLOT_LIMIT}`
    );
    const features = rowsToFeatures(rows);
    renderPlots(features, { highlightGlobalId });
    // Plot counts were noise in the header; only the "too many, zoom in"
    // case still says anything, because that one is actionable.
    statusEl.textContent = features.length >= PLOT_LIMIT ? t("limitReached", features.length) : "";
    return features;
  }

  // The kerb: paved-road polygons from the municipality's Road Edge Area layer.
  // Only the trafficked surfaces count as "the street" -- islands, pavements
  // and footpaths sit inside or beside the road and are not what a setback is
  // measured to. They are still drawn faintly for context.
  //
  // Restricting this to 7 (Road) was wrong. Nuzha block 1 parcel 51 fronts
  // طريق المغرب السريع, which is an Expressway (3) 18.86 m away and is exactly
  // what KME measures there (18.63 m) -- but the nearest Road was 89 m off, so
  // that frontage got no setback line and nothing to snap to at all.
  const KERB_SUBTYPES = new Set([3, 7, 8, 9]); // Expressway, Road, Roundabout, Service Road
  // A viewport's worth of road polygons is ~1.5 s on the wire -- they carry far
  // more vertices than the parcels do. Nobody measures a setback zoomed out, so
  // below this the layer is skipped entirely rather than made to slow down
  // panning on a phone.
  const KERB_MIN_ZOOM = 16;
  async function loadKerbsInView() {
    if (map.getZoom() < KERB_MIN_ZOOM) {
      kerbLayer.clearLayers();
      for (let i = snapSegs.length - 1; i >= 0; i--) {
        if (snapSegs[i].kind === "kerb") snapSegs.splice(i, 1);
      }
      return;
    }
    const b = map.getBounds();
    const rows = await api(
      `rpc/road_edges_in_bbox?min_lon=${b.getWest()}&min_lat=${b.getSouth()}` +
        `&max_lon=${b.getEast()}&max_lat=${b.getNorth()}`
    ).catch(() => []);

    kerbLayer.clearLayers();
    for (let i = snapSegs.length - 1; i >= 0; i--) {
      if (snapSegs[i].kind === "kerb") snapSegs.splice(i, 1);
    }

    const roads = [], other = [];
    for (const row of rows) {
      if (!row.geom) continue;
      const isRoad = KERB_SUBTYPES.has(row.subtype);
      (isRoad ? roads : other).push({
        type: "Feature", geometry: row.geom, properties: { name_ar: row.name_ar },
      });
      if (!isRoad) continue;
      const polys = row.geom.type === "MultiPolygon" ? row.geom.coordinates : [row.geom.coordinates];
      for (const poly of polys)
        for (const ring of poly)
          for (let i = 0; i < ring.length - 1; i++)
            snapSegs.push({ a: ring[i], b: ring[i + 1], kind: "kerb" });
    }

    L.geoJSON(
      { type: "FeatureCollection", features: other },
      { style: { color: "#95a5a6", weight: 1, fill: false, opacity: 0.5 }, interactive: false }
    ).addTo(kerbLayer);
    L.geoJSON(
      { type: "FeatureCollection", features: roads },
      {
        style: { color: "#c0392b", weight: 1.5, fill: false, opacity: 0.85 },
        onEachFeature: (f, lyr) => {
          if (f.properties.name_ar) lyr.bindTooltip(f.properties.name_ar);
        },
      }
    ).addTo(kerbLayer);
  }

  // ---- Search -------------------------------------------------------------
  // Accepts, in order of specificity:
  //   "2/64"          -> block 2, parcel 64
  //   digits          -> PACI number, else parcel number
  //   anything else   -> neighbourhood name (Arabic or English, partial)
  // On a hit it centres the map on the match, loads the plots around it, and
  // opens that plot's panel.
  const q = (s) => encodeURIComponent(s);

  async function runSearch(rawTerm) {
    const term = rawTerm.trim();
    if (!term) return;
    statusEl.textContent = t("searching");
    errEl.classList.remove("visible");

    const blockParcel = term.match(/^(\S+)\s*[/\-]\s*(\S+)$/);
    let rows = [];

    // All reads go through bounded RPCs -- the tables themselves are not
    // readable by the public key, so nobody can pull the whole dataset in one
    // request the way `?limit=100000` would have allowed.
    if (blockParcel) {
      rows = await api(
        `rpc/plot_by_block_parcel?blk=${q(blockParcel[1])}&par=${q(blockParcel[2])}`
      );
    } else if (/^\d+$/.test(term)) {
      rows = await api(`rpc/plot_by_parcel_no?par=${q(term)}`);
    } else {
      // Free text: street name, neighbourhood, or the name of a named feature
      // (mosque, co-op, tower), in either language. Several parcels usually
      // match a street, so these come back as a list to choose from.
      const hits = await api(`rpc/search_address?term=${q(term)}&max_rows=25`);
      if (hits.length) return showResults(hits, term);
      rows = [];
    }

    if (!rows.length) {
      statusEl.textContent = t("noMatch");
      errEl.textContent = t("noMatchHint", term);
      errEl.classList.add("visible");
      return;
    }
    // Block and parcel numbers repeat across the country -- dozens of
    // neighbourhoods have a block 6 -- so more than one match means the term
    // is ambiguous and the user has to choose. Silently taking the first was
    // how "6/10" landed in a random governorate.
    if (rows.length > 1) {
      return showResults(rows.map(plotToResult), term);
    }
    hideResults();
    await gotoPlot(rows[0]);
  }

  // Shapes a plot row like a search_address hit so both can share the list.
  function plotToResult(p) {
    const ring = p.geom?.coordinates?.[0] ?? [];
    const lat = ring.length ? ring.reduce((s, c) => s + c[1], 0) / ring.length : null;
    const lon = ring.length ? ring.reduce((s, c) => s + c[0], 0) / ring.length : null;
    return {
      global_id: p.global_id,
      parcel_no: p.parcel_no,
      block_no: p.block_no,
      house_no: p.house_no,
      street_ar: p.street_ar,
      street_en: p.street_en,
      neighborhood_ar: p.neighborhood_ar,
      neighborhood_en: p.neighborhood_en,
      governorate: p.governorate,
      lat,
      lon,
    };
  }

  // ---- Result list --------------------------------------------------------
  const resultsEl = document.getElementById("results");

  function hideResults() {
    resultsEl.classList.remove("visible");
    resultsEl.innerHTML = "";
  }

  function showResults(hits, term) {
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    statusEl.textContent = "";
    errEl.classList.remove("visible");
    resultsEl.innerHTML =
      `<div class="res-head">${t("results", hits.length, term)}</div>` +
      hits
        .map((h, i) => {
          const street = pick(h.street_ar, h.street_en);
          const nbh = pick(h.neighborhood_ar, h.neighborhood_en);
          // Lead with the parcel's identity, then where it is -- the same
          // result can be reached by parcel number or by street name, and
          // both readings need the area to tell duplicates apart.
          const line1 =
            [
              h.parcel_no ? `${t("parcel")} ${h.parcel_no}` : null,
              h.block_no ? `${t("block")} ${h.block_no}` : null,
            ].filter(Boolean).join(" · ") || street || "—";
          const line2 = [
            [street, h.house_no ? `${t("house")} ${h.house_no}` : null].filter(Boolean).join(" "),
            nbh,
            h.governorate,
          ].filter(Boolean).join(" · ");
          return `<button type="button" class="res-item" data-i="${i}">
                    <b>${line1}</b><span>${line2}</span>
                  </button>`;
        })
        .join("");
    resultsEl.classList.add("visible");

    for (const btn of resultsEl.querySelectorAll(".res-item")) {
      btn.addEventListener("click", async () => {
        const h = hits[Number(btn.dataset.i)];
        hideResults();
        map.setView([h.lat, h.lon], 18, { animate: false });
        await new Promise((r) => setTimeout(r, 120));
        await loadViewport({ highlightGlobalId: h.global_id });
      });
    }
  }

  // Centres on a plot, loads the plots around it, and opens its panel.
  async function gotoPlot(hit) {
    const ring = hit.geom?.coordinates?.[0] ?? [];
    if (!ring.length) return;
    const lat = ring.reduce((s, p) => s + p[1], 0) / ring.length;
    const lng = ring.reduce((s, p) => s + p[0], 0) / ring.length;

    // animate:false jumps straight there -- a search result should land
    // immediately, and it avoids depending on animation frames.
    skipNextMoveLoad = true;
    map.setView([lat, lng], 18, { animate: false });
    // Wait a tick so the new bounds have settled before asking for that area.
    await new Promise((r) => setTimeout(r, 120));
    await loadViewport({ highlightGlobalId: hit.global_id });
  }

  document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    clearTimeout(suggestTimer);
    runSearch(document.getElementById("searchInput").value).catch((err) => {
      statusEl.textContent = t("noMatch");
      errEl.textContent = err.message;
      errEl.classList.add("visible");
      console.error(err);
    });
  });

  // Live suggestions while typing. Deliberately only *lists* matches -- it
  // never navigates, because jumping the map on a keystroke while someone is
  // still typing is disorienting. Enter or a click commits.
  let suggestTimer = null;
  let suggestSeq = 0;
  const searchInputEl = document.getElementById("searchInput");

  searchInputEl.addEventListener("input", () => {
    clearTimeout(suggestTimer);
    const term = searchInputEl.value.trim();
    if (term.length < 2) return hideResults();

    suggestTimer = setTimeout(async () => {
      const seq = ++suggestSeq;
      try {
        const bp = term.match(/^(\S+)\s*[/\-]\s*(\S+)$/);
        let hits;
        if (bp) {
          const rows = await api(`rpc/plot_by_block_parcel?blk=${q(bp[1])}&par=${q(bp[2])}`);
          hits = rows.map(plotToResult);
        } else if (/^\d+$/.test(term)) {
          const rows = await api(`rpc/plot_by_parcel_no?par=${q(term)}`);
          hits = rows.map(plotToResult);
        } else {
          hits = await api(`rpc/search_address?term=${q(term)}&max_rows=25`);
        }
        // a slower earlier request must not overwrite a newer one
        if (seq !== suggestSeq) return;
        if (hits.length) showResults(hits, term);
        else hideResults();
      } catch (err) {
        console.error(err);
      }
    }, 300);
  });

  // ---- Address cascade ----------------------------------------------------
  // Neighbourhood -> block -> parcel, each list fetched from the server so it
  // stays correct as the dataset grows. (Governorate becomes a fourth level
  // once the national parcel layers are synced; this data has only one.)
  const selGov = document.getElementById("selGov");
  const selNbh = document.getElementById("selNbh");
  const selBlk = document.getElementById("selBlk");
  const selPar = document.getElementById("selPar");
  let govRows = [];
  let nbhRows = [];

  function nbhLabel(r) {
    return (lang === "ar" ? r.name_ar || r.name_en : r.name_en || r.name_ar) || "—";
  }

  function refreshSelectPlaceholders() {
    if (!selNbh) return;
    if (selGov.options.length) selGov.options[0].textContent = t("selGov");
    if (selNbh.options.length) selNbh.options[0].textContent = t("selNbh");
    if (selBlk.options.length) selBlk.options[0].textContent = t("selBlk");
    if (selPar.options.length) selPar.options[0].textContent = t("selPar");
    for (let i = 0; i < govRows.length; i++) {
      if (selGov.options[i + 1]) selGov.options[i + 1].textContent = nbhLabel(govRows[i]);
    }
    for (let i = 0; i < nbhRows.length; i++) {
      if (selNbh.options[i + 1]) selNbh.options[i + 1].textContent = nbhLabel(nbhRows[i]);
    }
    // The comboboxes show the option text, so they have to be repainted after
    // a language switch or they keep the previous language's labels.
    for (const s of [selGov, selNbh, selBlk, selPar]) s._combo?.sync();
  }

  function fillSelect(sel, placeholder, items, valueOf, labelOf) {
    sel.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = placeholder;
    sel.appendChild(ph);
    for (const it of items) {
      const o = document.createElement("option");
      o.value = valueOf(it);
      o.textContent = labelOf(it);
      sel.appendChild(o);
    }
    sel.disabled = items.length === 0;
    sel._combo?.sync();
  }

  // ---- Filterable dropdowns ----------------------------------------------
  // A native <select> cannot be typed into, and some neighbourhoods carry
  // hundreds of blocks and parcels, so picking one meant scrolling a huge
  // list. Each select gets a text box in front of it that narrows the list to
  // what actually matches as you type. The <select> itself is kept (hidden)
  // and still holds the value, so nothing reading `.value` or listening for
  // `change` had to change.
  function makeCombo(sel) {
    const wrap = document.createElement("div");
    wrap.className = "combo";
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▼";
    const list = document.createElement("ul");
    list.className = "combo-list";
    list.hidden = true;
    wrap.append(input, caret);
    document.body.appendChild(list);

    let active = -1;

    // Arabic gets typed with and without diacritics, and with any of several
    // alef forms, so a plain substring test misses matches a person would
    // consider obvious.
    const norm = (s) => (s || "")
      .toLowerCase()
      .replace(/[ً-ٰٟ]/g, "")
      .replace(/[إأآا]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .trim();

    function render(filter) {
      const q = norm(filter);
      const matches = [...sel.options]
        .filter((o) => o.value !== "")
        .filter((o) => !q || norm(o.textContent).includes(q));
      list.innerHTML = "";
      if (!matches.length) {
        const li = document.createElement("li");
        li.className = "none";
        li.textContent = t("noMatches");
        list.appendChild(li);
        return;
      }
      if (active >= matches.length) active = matches.length - 1;
      matches.forEach((o, i) => {
        const li = document.createElement("li");
        li.textContent = o.textContent;
        li.dataset.value = o.value;
        if (i === active) li.className = "active";
        // Pointing at a row makes it the candidate, so Enter takes what is
        // under the cursor rather than whatever the arrow keys last left.
        li.addEventListener("mouseenter", () => {
          active = i;
          for (const el of list.children) el.classList.remove("active");
          li.classList.add("active");
        });
        // mousedown, not click: blur would close the list first.
        li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(o.value); });
        list.appendChild(li);
      });
    }

    function choose(value) {
      sel.value = value;
      sync();
      close();
      sel.dispatchEvent(new Event("change", { bubbles: true }));
    }

    const close = () => { list.hidden = true; active = -1; wrap.classList.remove("open"); };

    // The list is no longer a child of the input, so it has to be told where to
    // go, in viewport coordinates. Clamped horizontally so a list wider than
    // its 80px input cannot run off the edge, and flipped above the field when
    // there is more room up there than down.
    function place() {
      const r = input.getBoundingClientRect();
      list.style.maxHeight = "none";
      const lw = list.offsetWidth;
      const below = window.innerHeight - r.bottom - 10;
      const above = r.top - 10;
      const flip = below < 140 && above > below;
      const maxH = Math.max(120, Math.min(280, flip ? above : below));
      list.style.maxHeight = maxH + "px";
      const lh = Math.min(list.scrollHeight + 2, maxH);

      const rtl = document.documentElement.dir === "rtl";
      let left = rtl ? r.right - lw : r.left;
      left = Math.max(6, Math.min(left, window.innerWidth - lw - 6));
      list.style.left = left + "px";
      list.style.top = (flip ? r.top - lh - 4 : r.bottom + 3) + "px";
      list.style.minWidth = r.width + "px";
    }

    function open(filter = "") {
      active = -1;
      render(filter);
      list.hidden = false; // must be laid out before it can be measured
      wrap.classList.add("open");
      place();
    }
    // Reflowing a detached list on every resize is not worth it; closing is.
    window.addEventListener("resize", () => { if (!list.hidden) close(); });

    input.addEventListener("focus", () => {
      if (sel.disabled) return;
      input.select(); // typing replaces the current choice rather than appending
      open(""); // the whole list first -- this is a picker, filtering is optional
    });
    // Reopens after Esc without needing to leave and re-enter the field.
    input.addEventListener("click", () => {
      if (!sel.disabled && list.hidden) open("");
    });
    input.addEventListener("input", () => { active = 0; render(input.value); list.hidden = false; });
    input.addEventListener("blur", () => setTimeout(() => { close(); sync(); }, 120));
    input.addEventListener("keydown", (e) => {
      const items = [...list.querySelectorAll("li[data-value]")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (list.hidden) { open(input.value); return; }
        if (!items.length) return;
        active += e.key === "ArrowDown" ? 1 : -1;
        if (active < 0) active = items.length - 1;
        if (active >= items.length) active = 0;
        render(input.value);
        list.querySelector("li.active")?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        // One remaining match is unambiguous, so Enter takes it even if the
        // user never arrowed onto it.
        const pick = items[active] ?? (items.length === 1 ? items[0] : null);
        if (pick) choose(pick.dataset.value);
      } else if (e.key === "Escape") {
        close();
        sync();
      }
    });

    function sync() {
      input.disabled = sel.disabled;
      wrap.classList.toggle("disabled", sel.disabled);
      input.placeholder = sel.options[0]?.textContent ?? "";
      const o = sel.selectedOptions[0];
      input.value = o && o.value !== "" ? o.textContent : "";
    }

    sel._combo = { sync };
    sync();
  }

  for (const s of [selGov, selNbh, selBlk, selPar]) makeCombo(s);

  const empty = (sel, key) => fillSelect(sel, t(key), [], (x) => x, (x) => x);

  // "Show area" needs only governorate + neighbourhood; block narrows it
  // further and parcel is optional. Requiring a full address just to look at
  // an area was the wrong way round.
  const showAreaBtn = document.getElementById("showAreaBtn");
  const syncShowArea = () => { showAreaBtn.disabled = !selNbh.value; };
  // Set before any programmatic map move so the moveend handler doesn't
  // re-fetch a view we've just loaded.
  let skipNextMoveLoad = false;

  async function showArea() {
    const nbh = selNbh.value;
    if (!nbh) return;
    const blk = selBlk.value || null;
    statusEl.textContent = t("searching");
    hideResults();
    clearSelection();

    const rows = await api(
      `rpc/area_extent?nbh=${q(nbh)}` + (blk ? `&blk=${q(blk)}` : "")
    );
    const e = rows?.[0];
    if (!e || e.min_lon == null) {
      statusEl.textContent = t("noMatch");
      errEl.textContent = t("noGeomHint");
      errEl.classList.add("visible");
      return;
    }
    errEl.classList.remove("visible");
    skipNextMoveLoad = true;
    map.fitBounds(
      [[e.min_lat, e.min_lon], [e.max_lat, e.max_lon]],
      { padding: [24, 24], animate: false, maxZoom: 18 }
    );
    await new Promise((r) => setTimeout(r, 150));
    const shown = await loadViewport();
    // Say how big the area is and whether everything in it is actually drawn.
    // A whole neighbourhood routinely exceeds the per-view cap, and silently
    // drawing a fraction would look like missing data.
    // Warn whenever the viewport cap was reached: at that point the map is
    // showing a truncated set, which may include part of the very area asked
    // for. Comparing against the area's own count isn't enough, because the
    // view also contains plots from neighbouring blocks.
    const drawn = Array.isArray(shown) ? shown.length : 0;
    statusEl.textContent =
      drawn >= PLOT_LIMIT
        ? t("areaPartial", e.plot_count)
        : t("areaShown", e.plot_count);
  }

  showAreaBtn.addEventListener("click", () => {
    showArea().catch((err) => {
      statusEl.textContent = t("loadFailed");
      errEl.textContent = err.message;
      errEl.classList.add("visible");
      console.error(err);
    });
  });

  async function initAddressCascade() {
    govRows = await api("rpc/list_governorates");
    fillSelect(selGov, t("selGov"), govRows, (r) => r.gov_no, nbhLabel);
    empty(selNbh, "selNbh");
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
  }

  // Every level below the one that changed is emptied BEFORE its fetch, not
  // after. Clearing only the levels further down left the next list holding the
  // previous governorate's neighbourhoods for the whole round trip -- openable,
  // and pickable, so you could select a neighbourhood that no longer belonged
  // to the governorate on screen.
  //
  // The sequence guard covers the other half of it: change governorate twice
  // quickly and the slower reply would otherwise land last and repopulate the
  // list from the one already moved on from. It is shared across all levels, so
  // a change at any level discards every fetch still in flight beneath it.
  let cascadeSeq = 0;

  selGov.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    empty(selNbh, "selNbh");
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
    syncShowArea();
    if (!selGov.value) return;
    const rows = await api(`rpc/list_nbhoods?gov=${q(selGov.value)}`);
    if (seq !== cascadeSeq) return;
    nbhRows = rows;
    fillSelect(selNbh, t("selNbh"), nbhRows, (r) => r.nbhood_no, nbhLabel);
    syncShowArea();
  });

  selNbh.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
    syncShowArea();
    if (!selNbh.value) return;
    const rows = await api(`rpc/list_blocks_v2?nbh=${q(selNbh.value)}`);
    if (seq !== cascadeSeq) return;
    fillSelect(selBlk, t("selBlk"), rows.map((r) => r.block_no), (x) => x, (x) => x);
  });

  selBlk.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    empty(selPar, "selPar");
    if (!selBlk.value) return;
    const rows = await api(
      `rpc/list_parcels_v2?nbh=${q(selNbh.value)}&blk=${q(selBlk.value)}`
    );
    if (seq !== cascadeSeq) return;
    // Label with house number or the feature's name where there is one.
    // The municipality's address index holds more addresses than the public
    // parcel layers have geometry for, so anything unmappable is marked.
    fillSelect(
      selPar,
      t("selPar"),
      rows,
      (r) => r.global_id,
      (r) => {
        // The same parcel number can appear twice in one block, told apart
        // only by street (1.27% of block+parcel keys), so the street is part
        // of the label rather than an afterthought.
        const street = lang === "ar" ? r.street_ar || r.street_en : r.street_en || r.street_ar;
        const base =
          [r.parcel_no || r.title || "—", street, r.house_no ? `${t("house")} ${r.house_no}` : null]
            .filter(Boolean)
            .join(" · ");
        return r.has_geom ? base : `${base} (${t("noGeom")})`;
      }
    );
  });

  selPar.addEventListener("change", async () => {
    if (!selPar.value) return;
    const rows = await api(`rpc/plot_by_gis?gis=${q(selPar.value)}`);
    if (rows.length) {
      hideResults();
      await gotoPlot(rows[0]);
    } else {
      // Known to the municipality's index but absent from the parcel layers.
      statusEl.textContent = "";
      errEl.textContent = t("noGeomHint");
      errEl.classList.add("visible");
    }
  });

  const modePaci = document.getElementById("modePaci");
  const modeAddr = document.getElementById("modeAddr");
  const addrForm = document.getElementById("addrForm");
  const searchForm = document.getElementById("searchForm");

  modePaci.addEventListener("click", () => {
    modePaci.classList.add("active");
    modeAddr.classList.remove("active");
    searchForm.hidden = false;
    addrForm.hidden = true;
  });
  modeAddr.addEventListener("click", () => {
    modeAddr.classList.add("active");
    modePaci.classList.remove("active");
    searchForm.hidden = true;
    addrForm.hidden = false;
  });

  // Parcels, kerb lines and road centrelines all follow the viewport together,
  // so the ruler's snap targets always match what's on screen.
  // Returns the plots actually drawn, so callers can tell whether a view
  // shows everything in an area or hit the per-view cap.
  async function loadViewport(opts = {}) {
    // Blocks and centrelines are no longer fetched at all -- nothing can show
    // them, and the block query alone was a request per viewport move.
    const [features] = await Promise.all([
      loadPlotsInView(opts),
      map.hasLayer(kerbLayer) ? loadKerbsInView() : Promise.resolve(),
    ]);
    return features;
  }

  // Restore a previous sign-in before the first paint, so the Analyse button is
  // either there or not rather than appearing a moment later.
  loadSession();
  applyLang();
  applyAuthUi();
  initAddressCascade().catch((err) => console.error("address cascade failed:", err));

  loadViewport().catch((err) => {
    statusEl.textContent = t("loadFailed");
    errEl.textContent = err.message;
    errEl.classList.add("visible");
    console.error(err);
  });

  // Reload for the new viewport after panning/zooming, so the map isn't empty
  // when you move away from the searched area. Debounced, and skipped when
  // zoomed too far out to keep the request meaningful.
  let moveTimer = null;
  // Pan and zoom to somewhere you already know, then load it -- no address or
  // parcel number needed. The automatic load on moveend covers the common case,
  // but it is debounced, it gives up below zoom 15, and it stays quiet after a
  // search, so there was no way to say "just show me what is here".
  const areaBtn = document.getElementById("areaBtn");
  areaBtn.addEventListener("click", async () => {
    if (map.getZoom() < 15) { statusEl.textContent = t("zoomIn"); return; }
    // A load is starting, so the debounced handler must not fire a second one
    // for the same view on top of it.
    clearTimeout(moveTimer);
    skipNextMoveLoad = true;
    areaBtn.disabled = true;
    statusEl.textContent = t("searching");
    clearSelection();
    hideResults();
    try {
      const features = await loadViewport();
      // Say how many turned up. loadPlotsInView clears the status when it is
      // under the cap, which left the button finishing in silence -- no way to
      // tell "nothing here" from "did not run".
      statusEl.textContent =
        features.length >= PLOT_LIMIT
          ? t("areaPartial", features.length)
          : t("areaShown", features.length);
    } catch (err) {
      statusEl.textContent = t("loadFailed");
      console.error(err);
    } finally {
      areaBtn.disabled = false;
    }
  });

  map.on("moveend", () => {
    if (measuring) return;
    // A programmatic jump (search result, "show area") already loaded the new
    // view and set its own status; without this the debounced handler would
    // fetch the same viewport again and overwrite that message.
    if (skipNextMoveLoad) { skipNextMoveLoad = false; return; }
    clearTimeout(moveTimer);
    moveTimer = setTimeout(() => {
      if (map.getZoom() < 15) {
        statusEl.textContent = t("zoomIn");
        return;
      }
      loadViewport().catch((err) => console.error(err));
    }, 350);
  });

  // No overlay toggles remain, so nothing to hook: the kerb layer is always on
  // and is loaded by loadViewport with everything else.

  // Installable app. Registered only over HTTPS (or localhost) -- browsers
  // refuse service workers on plain http, and the local dev server uses it.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
