    wrap.className = "combo";
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = "▼";
    const list = document.createElement("ul");
    list.className = "combo-list";
    list.hidden = true;
    wrap.append(input, caret);
    document.body.appendChild(list);

    let active = -1;

    // Arabic gets typed with and without diacritics, and with any of several
    // alef forms, so a plain substring test misses matches a person would
    // consider obvious.
    const norm = (s) => (s || "")
      .toLowerCase()
      .replace(/[ً-ٰٟ]/g, "")
      .replace(/[إأآا]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .trim();

    function render(filter) {
      const q = norm(filter);
      const matches = [...sel.options]
        .filter((o) => o.value !== "")
        .filter((o) => !q || norm(o.textContent).includes(q));
      list.innerHTML = "";
      if (!matches.length) {
        const li = document.createElement("li");
        li.className = "none";
        li.textContent = t("noMatches");
        list.appendChild(li);
        return;
      }
      if (active >= matches.length) active = matches.length - 1;
      matches.forEach((o, i) => {
        const li = document.createElement("li");
        li.textContent = o.textContent;
        li.dataset.value = o.value;
        if (i === active) li.className = "active";
        // Pointing at a row makes it the candidate, so Enter takes what is
        // under the cursor rather than whatever the arrow keys last left.
        li.addEventListener("mouseenter", () => {
          active = i;
          for (const el of list.children) el.classList.remove("active");
          li.classList.add("active");
        });
        // mousedown, not click: blur would close the list first.
        li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(o.value); });
        list.appendChild(li);
      });
    }

    function choose(value) {
      sel.value = value;
      sync();
      close();
      sel.dispatchEvent(new Event("change", { bubbles: true }));
    }

    const close = () => { list.hidden = true; active = -1; wrap.classList.remove("open"); };

    // The list is no longer a child of the input, so it has to be told where to
    // go, in viewport coordinates. Clamped horizontally so a list wider than
    // its 80px input cannot run off the edge, and flipped above the field when
    // there is more room up there than down.
    function place() {
      const r = input.getBoundingClientRect();
      list.style.maxHeight = "none";
      const lw = list.offsetWidth;
      const below = window.innerHeight - r.bottom - 10;
      const above = r.top - 10;
      const flip = below < 140 && above > below;
      const maxH = Math.max(120, Math.min(280, flip ? above : below));
      list.style.maxHeight = maxH + "px";
      const lh = Math.min(list.scrollHeight + 2, maxH);

      const rtl = document.documentElement.dir === "rtl";
      let left = rtl ? r.right - lw : r.left;
      left = Math.max(6, Math.min(left, window.innerWidth - lw - 6));
      list.style.left = left + "px";
      list.style.top = (flip ? r.top - lh - 4 : r.bottom + 3) + "px";
      list.style.minWidth = r.width + "px";
    }

    function open(filter = "") {
      active = -1;
      render(filter);
      list.hidden = false; // must be laid out before it can be measured
      wrap.classList.add("open");
      place();
    }
    // Reflowing a detached list on every resize is not worth it; closing is.
    window.addEventListener("resize", () => { if (!list.hidden) close(); });

    input.addEventListener("focus", () => {
      if (sel.disabled) return;
      input.select(); // typing replaces the current choice rather than appending
      open(""); // the whole list first -- this is a picker, filtering is optional
    });
    // Reopens after Esc without needing to leave and re-enter the field.
    input.addEventListener("click", () => {
      if (!sel.disabled && list.hidden) open("");
    });
    input.addEventListener("input", () => { active = 0; render(input.value); list.hidden = false; });
    input.addEventListener("blur", () => setTimeout(() => { close(); sync(); }, 120));
    input.addEventListener("keydown", (e) => {
      const items = [...list.querySelectorAll("li[data-value]")];
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (list.hidden) { open(input.value); return; }
        if (!items.length) return;
        active += e.key === "ArrowDown" ? 1 : -1;
        if (active < 0) active = items.length - 1;
        if (active >= items.length) active = 0;
        render(input.value);
        list.querySelector("li.active")?.scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        e.preventDefault();
        // One remaining match is unambiguous, so Enter takes it even if the
        // user never arrowed onto it.
        const pick = items[active] ?? (items.length === 1 ? items[0] : null);
        if (pick) choose(pick.dataset.value);
      } else if (e.key === "Escape") {
        close();
        sync();
      }
    });

    function sync() {
      input.disabled = sel.disabled;
      wrap.classList.toggle("disabled", sel.disabled);
      input.placeholder = sel.options[0]?.textContent ?? "";
      const o = sel.selectedOptions[0];
      input.value = o && o.value !== "" ? o.textContent : "";
    }

    sel._combo = { sync };
    sync();
  }

  for (const s of [selGov, selNbh, selBlk, selPar]) makeCombo(s);

  const empty = (sel, key) => fillSelect(sel, t(key), [], (x) => x, (x) => x);

  // "Show area" needs only governorate + neighbourhood; block narrows it
  // further and parcel is optional. Requiring a full address just to look at
  // an area was the wrong way round.
  const showAreaBtn = document.getElementById("showAreaBtn");
  const nbhReportBtn = document.getElementById("nbhReportBtn");
  const syncShowArea = () => {
    showAreaBtn.disabled = !selNbh.value;
    // Governorate + neighbourhood is enough to report on; block and parcel
    // narrow the map view but are not needed for a district breakdown.
    nbhReportBtn.disabled = !selNbh.value;
    nbhReportBtn.hidden = !session;
  };

  // Report a whole neighbourhood by its code rather than by a hand-drawn
  // outline: no clipped plots at the edge, no accidental spill into the next
  // district, and a grouped count on an indexed column instead of a spatial
  // intersect.
  nbhReportBtn.addEventListener("click", async () => {
    const gov = Number(selGov.value), nbh = Number(selNbh.value);
    if (!gov || !nbh) return;
    const blk = selBlk.value || null; // a chosen block narrows the report to it
    nbhReportBtn.disabled = true;
    statusEl.textContent = t("analysing");
    // The drawn outline belongs to a different question; clear it so the map
    // is not showing one area while the panel describes another.
    resetDrawing();
    reportScope = blk ? { kind: "blk", gov, nbh, blk } : { kind: "nbh", gov, nbh };
    try {
      const rows = blk
        ? await authRpc("area_report_blk", { gov, nbh, blk })
        : await authRpc("area_report_nbh", { gov, nbh });
      showReport(rows);
      statusEl.textContent = "";
    } catch (err) {
      showReportMessage(/401|not signed in/.test(err.message) ? t("signIn") : t("loadFailed"));
      statusEl.textContent = "";
      console.error(err);
    } finally {
      nbhReportBtn.disabled = false;
    }
  });
  // Set before any programmatic map move so the moveend handler doesn't
  // re-fetch a view we've just loaded.
  let skipNextMoveLoad = false;

  async function showArea() {
    const nbh = selNbh.value;
    if (!nbh) return;
    const blk = selBlk.value || null;
    statusEl.textContent = t("searching");
    hideResults();
    clearSelection();

    const rows = await api(
      `rpc/area_extent?nbh=${q(nbh)}` + (blk ? `&blk=${q(blk)}` : "")
    );
    const e = rows?.[0];
    if (!e || e.min_lon == null) {
      statusEl.textContent = t("noMatch");
      errEl.textContent = t("noGeomHint");
      errEl.classList.add("visible");
      return;
    }
    errEl.classList.remove("visible");
    skipNextMoveLoad = true;
    map.fitBounds(
      [[e.min_lat, e.min_lon], [e.max_lat, e.max_lon]],
      { padding: [24, 24], animate: false, maxZoom: 18 }
    );
    await new Promise((r) => setTimeout(r, 150));
    const shown = await loadViewport();
    // Say how big the area is and whether everything in it is actually drawn.
    // A whole neighbourhood routinely exceeds the per-view cap, and silently
    // drawing a fraction would look like missing data.
    // Warn whenever the viewport cap was reached: at that point the map is
    // showing a truncated set, which may include part of the very area asked
    // for. Comparing against the area's own count isn't enough, because the
    // view also contains plots from neighbouring blocks.
    const drawn = Array.isArray(shown) ? shown.length : 0;
    statusEl.textContent =
      drawn >= PLOT_LIMIT
        ? t("areaPartial", e.plot_count)
        : t("areaShown", e.plot_count);
  }

  showAreaBtn.addEventListener("click", () => {
    showArea().catch((err) => {
      statusEl.textContent = t("loadFailed");
      errEl.textContent = err.message;
      errEl.classList.add("visible");
      console.error(err);
    });
  });

  async function initAddressCascade() {
    govRows = await api("rpc/list_governorates");
    fillSelect(selGov, t("selGov"), govRows, (r) => r.gov_no, nbhLabel);
    empty(selNbh, "selNbh");
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
  }

  // Every level below the one that changed is emptied BEFORE its fetch, not
  // after. Clearing only the levels further down left the next list holding the
  // previous governorate's neighbourhoods for the whole round trip -- openable,
  // and pickable, so you could select a neighbourhood that no longer belonged
  // to the governorate on screen.
  //
  // The sequence guard covers the other half of it: change governorate twice
  // quickly and the slower reply would otherwise land last and repopulate the
  // list from the one already moved on from. It is shared across all levels, so
  // a change at any level discards every fetch still in flight beneath it.
  let cascadeSeq = 0;

  selGov.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    closeReport(); // it described the previous area
    empty(selNbh, "selNbh");
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
    syncShowArea();
    if (!selGov.value) return;
    const rows = await api(`rpc/list_nbhoods?gov=${q(selGov.value)}`);
    if (seq !== cascadeSeq) return;
    nbhRows = rows;
    fillSelect(selNbh, t("selNbh"), nbhRows, (r) => r.nbhood_no, nbhLabel);
    syncShowArea();
  });

  selNbh.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    closeReport();
    empty(selBlk, "selBlk");
    empty(selPar, "selPar");
    syncShowArea();
    if (!selNbh.value) return;
    // From `plots`, not address_index: the index describes the retired parcel
    // set, and in redeveloped areas its blocks no longer exist. Khiran offered
    // 14 blocks none of which any parcel is in.
    const rows = await api(`rpc/list_blocks_v3?gov=${q(selGov.value)}&nbh=${q(selNbh.value)}`);
    if (seq !== cascadeSeq) return;
    fillSelect(selBlk, t("selBlk"), rows.map((r) => r.block_no), (x) => x, (x) => x);
  });

  selBlk.addEventListener("change", async () => {
    const seq = ++cascadeSeq;
    closeReport(); // a report for the previous block no longer describes this one
    empty(selPar, "selPar");
    if (!selBlk.value) return;
    const rows = await api(
      `rpc/list_parcels_v3?gov=${q(selGov.value)}&nbh=${q(selNbh.value)}&blk=${q(selBlk.value)}`
    );
    if (seq !== cascadeSeq) return;
    // Label with house number or the feature's name where there is one.
    // The municipality's address index holds more addresses than the public
    // parcel layers have geometry for, so anything unmappable is marked.
    fillSelect(
      selPar,
      t("selPar"),
      rows,
      (r) => r.global_id,
      (r) => {
        // The same parcel number can appear twice in one block, told apart
        // only by street (1.27% of block+parcel keys), so the street is part
        // of the label rather than an afterthought.
        const street = lang === "ar" ? r.street_ar || r.street_en : r.street_en || r.street_ar;
        const base =
          [r.parcel_no || r.title || "—", street, r.house_no ? `${t("house")} ${r.house_no}` : null]
            .filter(Boolean)
            .join(" · ");
        return r.has_geom ? base : `${base} (${t("noGeom")})`;
      }
    );
  });

  selPar.addEventListener("change", async () => {
    if (!selPar.value) return;
    const rows = await api(`rpc/plot_by_gis?gis=${q(selPar.value)}`);
    if (rows.length) {
      hideResults();
      await gotoPlot(rows[0]);
    } else {
      // Known to the municipality's index but absent from the parcel layers.
      statusEl.textContent = "";
      errEl.textContent = t("noGeomHint");
      errEl.classList.add("visible");
    }
  });

  const modePaci = document.getElementById("modePaci");
  const modeAddr = document.getElementById("modeAddr");
  const addrForm = document.getElementById("addrForm");
  const searchForm = document.getElementById("searchForm");

  modePaci.addEventListener("click", () => {
    modePaci.classList.add("active");
    modeAddr.classList.remove("active");
    searchForm.hidden = false;
    addrForm.hidden = true;
  });
  modeAddr.addEventListener("click", () => {
    modeAddr.classList.add("active");
    modePaci.classList.remove("active");
    searchForm.hidden = true;
    addrForm.hidden = false;
  });

  // Parcels, kerb lines and road centrelines all follow the viewport together,
  // so the ruler's snap targets always match what's on screen.
  // Returns the plots actually drawn, so callers can tell whether a view
  // shows everything in an area or hit the per-view cap.
  async function loadViewport(opts = {}) {
    // Blocks and centrelines are no longer fetched at all -- nothing can show
    // them, and the block query alone was a request per viewport move.
    const [features] = await Promise.all([
      loadPlotsInView(opts),
      map.hasLayer(kerbLayer) ? loadKerbsInView() : Promise.resolve(),
    ]);
    return features;
  }

  // Restore a previous sign-in before the first paint, so the Analyse button is
  // either there or not rather than appearing a moment later.
  loadSession();
  loadLandUseNames();
  applyLang();
  applyAuthUi();
  initAddressCascade().catch((err) => console.error("address cascade failed:", err));

  loadViewport().catch((err) => {
    statusEl.textContent = t("loadFailed");
    errEl.textContent = err.message;
    errEl.classList.add("visible");
    console.error(err);
  });

  // Reload for the new viewport after panning/zooming, so the map isn't empty
  // when you move away from the searched area. Debounced, and skipped when
  // zoomed too far out to keep the request meaningful.
  let moveTimer = null;
  // Pan and zoom to somewhere you already know, then load it -- no address or
  // parcel number needed. The automatic load on moveend covers the common case,
  // but it is debounced, it gives up below zoom 15, and it stays quiet after a
  // search, so there was no way to say "just show me what is here".
  const areaBtn = document.getElementById("areaBtn");
  areaBtn.addEventListener("click", async () => {
    if (map.getZoom() < 15) { statusEl.textContent = t("zoomIn"); return; }
    // A load is starting, so the debounced handler must not fire a second one
    // for the same view on top of it.
    clearTimeout(moveTimer);
    skipNextMoveLoad = true;
    areaBtn.disabled = true;
    statusEl.textContent = t("searching");
    clearSelection();
    hideResults();
    try {
      const features = await loadViewport();
      // Say how many turned up. loadPlotsInView clears the status when it is
      // under the cap, which left the button finishing in silence -- no way to
      // tell "nothing here" from "did not run".
      statusEl.textContent =
        features.length >= PLOT_LIMIT
          ? t("areaPartial", features.length)
          : t("areaShown", features.length);
    } catch (err) {
      statusEl.textContent = t("loadFailed");
      console.error(err);
    } finally {
      areaBtn.disabled = false;
    }
  });

  map.on("moveend", () => {
    if (measuring) return;
    // A programmatic jump (search result, "show area") already loaded the new
    // view and set its own status; without this the debounced handler would
    // fetch the same viewport again and overwrite that message.
    if (skipNextMoveLoad) { skipNextMoveLoad = false; return; }
    clearTimeout(moveTimer);
    moveTimer = setTimeout(() => {
      if (map.getZoom() < 15) {
        statusEl.textContent = t("zoomIn");
        return;
      }
      loadViewport().catch((err) => console.error(err));
    }, 350);
  });

  // The kerb layer is always on and loads with everything else; both overlay
  // toggles change what is drawn, not what is loaded.
  map.on("overlayadd", (e) => {
    if (e.layer === shadingLayer) setPlotFill(true);
    if (e.layer === edgeLinesLayer) setEdgeLines(true);
  });
  map.on("overlayremove", (e) => {
    if (e.layer === shadingLayer) setPlotFill(false);
    if (e.layer === edgeLinesLayer) setEdgeLines(false);
  });

  // Installable app. Registered only over HTTPS (or localhost) -- browsers
  // refuse service workers on plain http, and the local dev server uses it.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
