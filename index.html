  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    // Esc leaves a tool rather than just tidying up inside it. Measure used to
    // only cancel a half-drawn line and stay switched on, so the next plot you
    // clicked started a measurement instead of opening its details. A line in
    // progress still gets cancelled first, so that is not lost on one press.
    if (measuring && measureStart) cancelInProgress();
    else if (measuring) document.getElementById("measureBtn").click();
    else if (drawMode) setDrawMode(false);
    else if (!reportEl.hidden) { closeReport(); drawLayer.clearLayers(); }
    else if (setbackMode) { setSetbackMode(false); statusEl.textContent = ""; }
    else if (resultsEl.classList.contains("visible")) hideResults();
    else clearSelection();
  });

  // Clicking empty map deselects. A click on a plot fires on the layer first
  // and then reaches the map, so the layer handler sets a flag to opt out.
  //
  // Neither drawing mode may deselect: placing a setback by hand is a click on
  // the map, and it was throwing away the selected plot -- taking the info
  // panel, and with it the Print button, off the screen mid-measurement.
  let plotJustClicked = false;
  map.on("click", () => {
    if (plotJustClicked) { plotJustClicked = false; return; }
    if (measuring || setbackMode || drawMode) return;
    clearSelection();
    // Clicking empty map is the "clear what I was looking at" gesture, and an
    // area report is part of what you were looking at.
    if (!reportEl.hidden) { closeReport(); drawLayer.clearLayers(); }
  });

  // Clear means clear: the measurements, the selected plot, and any area
  // report. It used to drop only the measurement lines, so pressing it with a
  // plot selected appeared to do nothing.
  document.getElementById("clearBtn").addEventListener("click", () => {
    clearAllMeasurements();
    clearSelection();
    closeReport();
    drawLayer.clearLayers();
    statusEl.textContent = "";
  });

  function updateInProgress(ll) {
    measureLine.setLatLngs([measureStart, ll]);
    // Vincenty rather than Leaflet's spherical map.distance(), so the ruler
    // agrees with the side lengths shown in the panel.
    const text = fmtDistance(
      geodesicMetres([measureStart.lng, measureStart.lat], [ll.lng, ll.lat])
    );
    const mid = L.latLng((measureStart.lat + ll.lat) / 2, (measureStart.lng + ll.lng) / 2);
    if (measureLabel) { measureLabel.setLatLng(mid); measureLabel.setContent(text); }
    else
      measureLabel = L.tooltip({
        permanent: true, direction: "top", className: "measure-label", interactive: true,
      })
        .setLatLng(mid).setContent(text).addTo(map);
  }

  // ---- Magnifier ----------------------------------------------------------
  let magMap = null, magSegs = null, magDot = null, magLastDraw = 0;
  let magSat = null, magOsm = null;
  const magEl = document.getElementById("mag");

  function ensureMag() {
    if (magMap) return;
    magMap = L.map("magMap", {
      zoomControl: false, attributionControl: false, dragging: false,
      scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
      keyboard: false, touchZoom: false, inertia: false,
    }).setView(map.getCenter(), map.getZoom() + 3);
    // maxNativeZoom lets these scale past the deepest real tile instead of
    // going blank, which is what makes it act like a magnifier.
    magSat = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 22, maxNativeZoom: 19 }
    );
    magOsm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 22, maxNativeZoom: 19,
    });
    magSegs = L.layerGroup().addTo(magMap);
    magDot = L.circleMarker(map.getCenter(), {
      radius: 5, color: "#fff", weight: 2, fillColor: "#c0392b", fillOpacity: 1, interactive: false,
    }).addTo(magMap);
    syncMagBase();
  }

  // The magnifier mirrors whichever basemap the main map is showing.
  function syncMagBase() {
    if (!magMap) return;
    const wantSat = map.hasLayer(satellite);
    const add = wantSat ? magSat : magOsm;
    const drop = wantSat ? magOsm : magSat;
    if (magMap.hasLayer(drop)) magMap.removeLayer(drop);
    if (!magMap.hasLayer(add)) add.addTo(magMap);
    magSegs.bringToFront();
    magDot.bringToFront();
  }
  map.on("baselayerchange", syncMagBase);

  function updateMag(ll, kind) {
    if (!measuring) return;
    ensureMag();
    magMap.setView(ll, Math.min(22, map.getZoom() + 3), { animate: false });
    magDot.setLatLng(ll).setStyle({ fillColor: SNAP_COLORS[kind] || "#c0392b" });

    // Redrawing every candidate line on every mouse move is wasteful; throttle
    // and only include segments within ~80 m of the cursor.
    const now = Date.now();
    if (now - magLastDraw < 70) return;
    magLastDraw = now;
    magSegs.clearLayers();
    const mx = mPerDegLon(ll.lat), my = mPerDegLat(ll.lat);
    const px = ll.lng * mx, py = ll.lat * my;
    const R = 80;
    for (const s of snapSegs) {
      const ax = s.a[0] * mx, ay = s.a[1] * my;
      if (Math.abs(ax - px) > R || Math.abs(ay - py) > R) continue;
      L.polyline([[s.a[1], s.a[0]], [s.b[1], s.b[0]]], {
        color: SNAP_COLORS[s.kind] || "#999", weight: 2, interactive: false,
      }).addTo(magSegs);
    }
    if (measureStart) {
      L.polyline([measureStart, ll], {
        color: "#c0392b", weight: 2, dashArray: "4,3", interactive: false,
      }).addTo(magSegs);
    }
  }

  const mapEl = map.getContainer();
  let downAt = 0;
  let downPt = null;

  // Leaflet renders its controls INSIDE the map container, so the capture-phase
  // listeners below see clicks on the layer switcher too -- and swallowed them,
  // toggling nothing and starting a measurement underneath the panel instead.
  // Anything that belongs to a control is not a click on the map.
  const onMapSurface = (e) =>
    !(e.target instanceof Element) || !e.target.closest(".leaflet-control-container");

  // Both interaction styles are supported off the same events:
  //   drag  -> press, move, release (release commits)
  //   click -> click to anchor, move, click again to commit
  // A release that was neither a real drag nor far from the press point is
  // treated as the first click of a two-click measurement.
  mapEl.addEventListener("pointerdown", (e) => {
    if (!measuring || !onMapSurface(e)) return;
    e.preventDefault();
    e.stopPropagation();
    downAt = Date.now();
    downPt = { x: e.clientX, y: e.clientY };

    const raw = map.mouseEventToLatLng(e);
    if (measureStart) {
      // Second click ends the line exactly where you put it -- only the
      // starting anchor snaps (perpendicular lock still applies if on).
      updateInProgress(applyPerp(raw));
      commitMeasurement();
      return;
    }
    const { ll } = snapLatLng(raw);
    measureStart = ll;
    dragging = false;
    setPerpBasis(ll);
    measureLine = L.polyline([ll, ll], {
      color: "#c0392b", weight: 3, dashArray: "6,4",
    }).addTo(map);
  }, true);

  mapEl.addEventListener("pointermove", (e) => {
    if (!measuring || !onMapSurface(e)) return;
    const raw = map.mouseEventToLatLng(e);
    if (!measureStart) {
      // Previewing where the anchor would land -- this end snaps.
      const { ll, kind } = snapLatLng(raw);
      setSnapMarker(ll, kind);
      updateMag(ll, kind);
      return;
    }
    // Both ends latch on now. Measuring a setback by hand means landing exactly
    // on the kerb or on the neighbouring boundary, not near it, and eyeballing
    // that was costing metres. Snap first, then apply the perpendicular lock,
    // so the line stays square to the boundary and still reports the
    // perpendicular distance to whatever it caught.
    const { ll: snapped, kind } = snapLatLng(raw);
    const end = applyPerp(snapped);
    setSnapMarker(kind ? end : null, kind);
    updateMag(end, kind);
    if (downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 4) dragging = true;
    e.preventDefault();
    e.stopPropagation();
    updateInProgress(end);
  }, true);

  mapEl.addEventListener("pointerup", (e) => {
    if (!measuring || !onMapSurface(e)) return;
    e.stopPropagation();
    const moved = downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 4;
    downPt = null;
    // A genuine drag ends the measurement on release. A simple click leaves
    // the line anchored so the next click finishes it.
    if (measureStart && dragging && moved && Date.now() - downAt > 80) commitMeasurement();
  }, true);

  function fmtNum(n, unit) {
    return n == null ? "&mdash;" : `${Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 })} ${unit}`;
  }

  // ---- Dimension display --------------------------------------------------
  // About half the boundaries in the municipality's data sit exactly on a
  // surveyed value (whole 0.5 m); the rest are digitised approximations off by
  // 10-20 cm. Default view snaps only the ones already within a few centimetres
  // of a clean value, so 19.999 reads as 20 while a genuine 33.86 is left
  // alone -- rounding that to 34 would invent precision the data doesn't have.
  // "Exact" shows every side as measured, to one decimal.
  // 5 cm. A wider tolerance (10 cm) pulled genuine values onto the wrong half
  // metre and made the panel contradict itself: 14.401 became 14.5, so the
  // sides no longer multiplied to the stated area (26 x 14.5 = 377 against a
  // recorded 374.4). Sides that are truly on a surveyed value sit within a
  // centimetre or two of it, so this still cleans those up -- measured over
  // 4,090 sides, 52.1% are within 2 cm and only 52.6% within 5 cm, meaning
  // almost nothing legitimate lives between the two.
  const SNAP_TOLERANCE_M = 0.05;
  let exactMode = false;

  function fmtSide(metres) {
    if (metres == null) return "&mdash;";
    if (!exactMode) {
      const clean = Math.round(metres * 2) / 2; // nearest 0.5 m
      // epsilon so values sitting exactly on the tolerance don't snap or not
      // depending on floating-point representation (24.9 vs 12.4 both being
      // 0.1 away, one landing a hair over).
      if (Math.abs(metres - clean) <= SNAP_TOLERANCE_M + 1e-9) {
        return `${clean % 1 === 0 ? clean.toFixed(0) : clean.toFixed(1)} m`;
      }
    }
    return `${metres.toFixed(1)} m`;
  }

  document.getElementById("exactBtn").addEventListener("click", () => {
    exactMode = !exactMode;
    document.getElementById("exactBtn").classList.toggle("active", exactMode);
    if (selectedProps) showPanel(selectedProps, selectedLayer);
  });

  // Vincenty inverse on the WGS84 ellipsoid. The national parcel layers are
  // Web Mercator (no metric geometry to measure directly), so side lengths are
  // measured geodesically from the WGS84 ring instead.
  //
  // Method was checked against a parcel whose official cadastral dimensions
  // are known (20.000 m sides, 80.0003 m perimeter): Vincenty reproduces
  // 20.000 exactly, while haversine with the equatorial radius reads 0.18%
  // long at this latitude -- roughly 9 cm on a 20 m boundary.
  function geodesicMetres(a, b) {
    const f = 1 / 298.257223563, A = 6378137, B = A * (1 - f);
    const L = ((b[0] - a[0]) * Math.PI) / 180;
    const U1 = Math.atan((1 - f) * Math.tan((a[1] * Math.PI) / 180));
    const U2 = Math.atan((1 - f) * Math.tan((b[1] * Math.PI) / 180));
    const sU1 = Math.sin(U1), cU1 = Math.cos(U1);
    const sU2 = Math.sin(U2), cU2 = Math.cos(U2);
    let lam = L, lamP, i = 0, sS, cS, S, sA, c2SM, C;
    do {
      const sL = Math.sin(lam), cL = Math.cos(lam);
      sS = Math.sqrt((cU2 * sL) ** 2 + (cU1 * sU2 - sU1 * cU2 * cL) ** 2);
      if (sS === 0) return 0;
      cS = sU1 * sU2 + cU1 * cU2 * cL;
      S = Math.atan2(sS, cS);
      sA = (cU1 * cU2 * sL) / sS;
      const c2A = 1 - sA * sA;
      c2SM = c2A !== 0 ? cS - (2 * sU1 * sU2) / c2A : 0;
      C = (f / 16) * c2A * (4 + f * (4 - 3 * c2A));
      lamP = lam;
      lam = L + (1 - C) * f * sA * (S + C * sS * (c2SM + C * cS * (-1 + 2 * c2SM * c2SM)));
    } while (Math.abs(lam - lamP) > 1e-12 && ++i < 200);
    const u2 = ((1 - sA * sA) * (A * A - B * B)) / (B * B);
    const Aa = 1 + (u2 / 16384) * (4096 + u2 * (-768 + u2 * (320 - 175 * u2)));
    const Bb = (u2 / 1024) * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
    const dS =
      Bb * sS * (c2SM + (Bb / 4) * (cS * (-1 + 2 * c2SM * c2SM) -
        (Bb / 6) * c2SM * (-3 + 4 * sS * sS) * (-3 + 4 * c2SM * c2SM)));
    return B * Aa * (S - dS);
  }

  // Area measured from the boundary. The national layers carry `Area_Nom`, a
  // nominal figure that disagrees with the cadastral measured area (404.48 vs
  // 400.00 m² on the reference parcel), so the geometry is measured directly:
  // project to local metres, then shoelace. At parcel scale the projection
  // error is far below a square metre.
  function computeAreaM2(geomWgs) {
    const ring = geomWgs?.coordinates?.[0];
    if (!ring || ring.length < 4) return null;
    const kx = mPerDegLon(ring[0][1]), ky = mPerDegLat(ring[0][1]);
    let sum = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      sum += ring[i][0] * kx * (ring[i + 1][1] * ky) - ring[i + 1][0] * kx * (ring[i][1] * ky);
    }
    return Math.abs(sum) / 2;
  }

  // Sides are numbered 1..n in the order the source stores the boundary, and
  // the same numbers are drawn at each edge's midpoint on the map.
  // The source often stores extra vertices along a straight boundary, so a
  // four-sided parcel can arrive with six or more segments. Duplicate points
  // are dropped and consecutive segments that continue in the same direction
  // are merged, so "side 1" is a side a surveyor would recognise rather than
  // an arbitrary piece of one.
  const COLLINEAR_TOLERANCE_M = 0.15; // deviation from straight before it counts as a real corner

  function simplifyRing(ring) {
    const kx = mPerDegLon(ring[0][1]), ky = mPerDegLat(ring[0][1]);
    const closed =
      ring.length > 1 &&
      ring[0][0] === ring[ring.length - 1][0] &&
      ring[0][1] === ring[ring.length - 1][1];
    const pts = closed ? ring.slice(0, -1) : ring.slice();

    // drop duplicates
    const uniq = [];
    for (const p of pts) {
      const q = uniq[uniq.length - 1];
      if (!q || Math.hypot((p[0] - q[0]) * kx, (p[1] - q[1]) * ky) > 0.05) uniq.push(p);
    }
    if (uniq.length < 3) return closed ? ring : [...ring, ring[0]];

    // drop vertices that sit on the line between their neighbours
    const keep = [];
    for (let i = 0; i < uniq.length; i++) {
      const a = uniq[(i - 1 + uniq.length) % uniq.length];
      const b = uniq[i];
      const c = uniq[(i + 1) % uniq.length];
      const ax = a[0] * kx, ay = a[1] * ky;
      const bx = b[0] * kx, by = b[1] * ky;
      const cx = c[0] * kx, cy = c[1] * ky;
      const vx = cx - ax, vy = cy - ay;
      const len = Math.hypot(vx, vy);
      const dev = len === 0 ? 0 : Math.abs((bx - ax) * vy - (by - ay) * vx) / len;
      if (dev > COLLINEAR_TOLERANCE_M) keep.push(b);
    }
    const out = keep.length >= 3 ? keep : uniq;
    return [...out, out[0]];
  }

  function computeSideDetails(geomWgs) {
    const raw = geomWgs?.coordinates?.[0];
    if (!raw) return [];
    const ring = simplifyRing(raw);
    const sides = [];
    for (let i = 0; i < ring.length - 1; i++) {
      sides.push({
        n: i + 1,
        length: geodesicMetres(ring[i], ring[i + 1]),
        mid: L.latLng((ring[i][1] + ring[i + 1][1]) / 2, (ring[i][0] + ring[i + 1][0]) / 2),
        // Endpoints kept so the automatic setback can work off the same
        // simplified sides the panel numbers, rather than the raw ring.
        a: ring[i],
        b: ring[i + 1],
      });
    }
    return sides;
  }

  const sideLabels = L.layerGroup().addTo(map);
  let selectedOutline = null;

  // ---- Parcel number labels ----------------------------------------------
  const parcelLabels = L.layerGroup().addTo(map);
  const LABEL_MIN_ZOOM = 17;
  let labelledFeatures = [];

  function updateParcelLabels() {
    parcelLabels.clearLayers();
    if (map.getZoom() < LABEL_MIN_ZOOM) return;
    const bounds = map.getBounds();
    for (const f of labelledFeatures) {
      const num = f.properties?.parcel_no;
      if (!num) continue;
      const ring = f.geometry?.coordinates?.[0];
      if (!ring?.length) continue;
      const lat = ring.reduce((s, c) => s + c[1], 0) / ring.length;
      const lon = ring.reduce((s, c) => s + c[0], 0) / ring.length;
      if (!bounds.contains([lat, lon])) continue;
      L.marker([lat, lon], {
        interactive: false,
        keyboard: false,
        icon: L.divIcon({ className: "parcel-label", html: String(num), iconSize: null }),
      }).addTo(parcelLabels);
    }
  }
  map.on("zoomend", updateParcelLabels);

  // Deselect: hides the panel, the red outline and the side numbers.
  function clearSelection() {
    sideLabels.clearLayers();
    clearSidePicks();
    if (selectedOutline) { map.removeLayer(selectedOutline); selectedOutline = null; }
    // Drop the hover shading too. mouseout would do it eventually, but after
    // clicking a plot to let go of it the pointer is still sitting on it, so
    // without this the plot stays lit as though it were still chosen.
    if (selectedLayer && selectedLayer.feature && plotLayer?.hasLayer?.(selectedLayer)) {
      selectedLayer.setStyle(plotStyle(selectedLayer.feature));
    }
    panelEl.classList.remove("visible");
    panelEl.innerHTML = "";
    selectedProps = null;
    selectedLayer = null;
  }

  function showSideLabels(props, layer) {
    sideLabels.clearLayers();
    if (selectedOutline) { map.removeLayer(selectedOutline); selectedOutline = null; }
    if (layer) {
      selectedOutline = L.polyline(layer.getLatLngs()[0].concat([layer.getLatLngs()[0][0]]), {
        color: "#c0392b", weight: 3, opacity: 0.95,
        // Decoration only. Left interactive it sat on top of the selected
        // plot's boundary and swallowed clicks: pressing a neighbouring plot
        // near the shared edge hit this line, which has no handler, so nothing
        // happened and the selection looked stuck.
        interactive: false,
      }).addTo(map);
    }
    for (const s of props.sides) {
      if (!s.mid) continue;
      L.marker(s.mid, {
        interactive: false,
        icon: L.divIcon({ className: "side-num", html: String(s.n), iconSize: [20, 20] }),
      }).addTo(sideLabels);
    }
  }

  // A self-contained SVG of the parcel with numbered, dimensioned edges --
  // drawn from the projected geometry so it prints without needing map tiles.
  function buildPlotSvg(geomWgs, sides, setbacks) {
    const lonlat = geomWgs?.coordinates?.[0];
    if (!lonlat) return "";
    // Project to local metres so the drawing has true proportions (a degree of
    // longitude is much shorter than a degree of latitude at this latitude).
    const lat0 = lonlat[0][1];
    const kx = mPerDegLon(lat0), ky = mPerDegLat(lat0);
    // The SAME simplified ring the side lengths come from. Indexing the raw
    // ring here put every label on the wrong edge whenever simplification had
    // merged a redundant vertex, which is most plots.
    const simple = simplifyRing(lonlat);
    // Shifted to a local origin. Absolute metres put the viewBox at ~4.6
    // million with a ~40-unit viewport, and renderers rasterise in single
    // precision, where that quantises to about half a metre -- enough to
    // visibly deform a house plot.
    const ox0 = lonlat[0][0] * kx, oy0 = lat0 * ky;
    const ring = simple.map(([lon, lat]) => [lon * kx - ox0, lat * ky - oy0]);
    const xs = ring.map((p) => p[0]);
    const ys = ring.map((p) => p[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs);
    const miny = Math.min(...ys), maxy = Math.max(...ys);
    const w = maxx - minx || 1;
    const h = maxy - miny || 1;
    const pad = Math.max(w, h) * 0.22;
    const flipY = (y) => miny + maxy - y; // SVG y grows downward
    const pts = ring.map(([x, y]) => `${x},${flipY(y)}`).join(" ");
    const fs = Math.max(w, h) / 16;

    const labels = sides
      .map((s, i) => {
        const [x1, y1] = ring[i];
        const [x2, y2] = ring[i + 1];
        const mx = (x1 + x2) / 2;
        const my = flipY((y1 + y2) / 2);
        const cx = (minx + maxx) / 2;
        const cy = flipY((miny + maxy) / 2);
        // Nudge the label outward from the centre so it clears the edge.
        const dx = mx - cx, dy = my - cy;
        const len = Math.hypot(dx, dy) || 1;
        const ox = mx + (dx / len) * fs * 1.1;
        const oy = my + (dy / len) * fs * 1.1;
        // Third line, in the kerb colour, only where a street actually faces
        // this side -- on most plots that is one or two of the four.
        const sb = setbacks?.get(s.n);
        const sbText = sb == null ? "" :
          `<text x="${ox}" y="${oy + fs * 1.75}" font-size="${fs * 0.66}" text-anchor="middle" dominant-baseline="middle" fill="#c0392b">${sb.toFixed(2)} m</text>`;
        return `<text x="${ox}" y="${oy}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="#17211b">${s.n}</text>
                <text x="${ox}" y="${oy + fs}" font-size="${fs * 0.72}" text-anchor="middle" dominant-baseline="middle" fill="#5b6b60">${fmtSide(s.length).replace("&mdash;", "—")}</text>${sbText}`;
      })
      .join("");

    return `<svg viewBox="${minx - pad} ${miny - pad} ${w + 2 * pad} ${h + 2 * pad}" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-height:340px">
      <polygon points="${pts}" fill="#e8efe6" stroke="#3c6e47" stroke-width="${Math.max(w, h) / 220}" />
      ${labels}
    </svg>`;
  }

  // ---- Printed map -------------------------------------------------------
  // The plain outline was hard to place on the ground, so the sheet now prints
  // the plot over the same basemap the user is looking at, at a zoom chosen to
  // fit, with the plot centred. Built from tile <img>s positioned by Leaflet's
  // own projection, so the overlay lines up exactly with the imagery.
  const PRINT_W = 620, PRINT_H = 430, TILE = 256;

  function printMapPlan(geomWgs) {
    const lonlat = geomWgs?.coordinates?.[0];
    if (!lonlat) return null;
    const bounds = L.latLngBounds(lonlat.map(([lon, lat]) => L.latLng(lat, lon)));
    const centre = bounds.getCenter();

    // Largest zoom where the plot plus a margin still fits the printed box.
    let zoom = 19;
    for (; zoom > 13; zoom--) {
      const a = map.project(bounds.getNorthWest(), zoom);
      const b = map.project(bounds.getSouthEast(), zoom);
      if (Math.abs(b.x - a.x) <= PRINT_W * 0.62 && Math.abs(b.y - a.y) <= PRINT_H * 0.62) break;
    }

    const mid = map.project(centre, zoom);
    const originX = mid.x - PRINT_W / 2;
    const originY = mid.y - PRINT_H / 2;
    const toPx = (lon, lat) => {
      const p = map.project(L.latLng(lat, lon), zoom);
      return [p.x - originX, p.y - originY];
    };

    const sat = map.hasLayer(satellite);
    const urls = [];
    const x0 = Math.floor(originX / TILE), x1 = Math.floor((originX + PRINT_W) / TILE);
    const y0 = Math.floor(originY / TILE), y1 = Math.floor((originY + PRINT_H) / TILE);
    const max = Math.pow(2, zoom);
    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= max) continue;
        const wx = ((tx % max) + max) % max; // wrap at the date line
        const url = sat
          ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ty}/${wx}`
          : `https://${"abc"[(wx + ty) % 3]}.tile.openstreetmap.org/${zoom}/${wx}/${ty}.png`;
        urls.push({ url, left: tx * TILE - originX, top: ty * TILE - originY });
      }
    }
    return { zoom, toPx, urls, sat };
  }

  // Metres per printed pixel, for the scale bar.
  function printScaleBar(zoom, lat) {
    const mPerPx = (156543.03392 * Math.cos((lat * Math.PI) / 180)) / Math.pow(2, zoom);
    // A round number of metres that lands near 110 px.
    const nice = [5, 10, 20, 25, 50, 100, 200];
    let metres = nice[0];
    for (const n of nice) if (n / mPerPx <= 130) metres = n;
    return { metres, px: metres / mPerPx };
  }

  let selectedProps = null;
  let selectedLayer = null;

  // Area-weighted centroid, not the average of the vertices: on an L-shaped or
  // unevenly-vertexed plot the vertex average drifts towards whichever side has
  // more points, which can land the pin outside the plot entirely.
  function plotCentre(geomWgs) {
    const ring = geomWgs?.coordinates?.[0];
    if (!ring || ring.length < 4) return null;
    let a2 = 0, cx = 0, cy = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const [x1, y1] = ring[i], [x2, y2] = ring[i + 1];
      const f = x1 * y2 - x2 * y1;
      a2 += f;
      cx += (x1 + x2) * f;
      cy += (y1 + y2) * f;
    }
    if (Math.abs(a2) < 1e-12) { // degenerate ring -- fall back to the average
      let sx = 0, sy = 0;
      for (let i = 0; i < ring.length - 1; i++) { sx += ring[i][0]; sy += ring[i][1]; }
      const n = ring.length - 1;
      return [sx / n, sy / n];
    }
    return [cx / (3 * a2), cy / (3 * a2)];
  }

  // The municipality's 55 land-use names, fetched once. Without them a plot in
  // the shared "other" colour could only be described as "other", which is the
  // one thing the panel exists to improve on.
  let landUseNames = null;
  async function loadLandUseNames() {
    try {
      const rows = await api("rpc/list_land_uses");
      landUseNames = new Map(rows.map((r) => [r.code, r.name_ar]));
      if (selectedProps) showPanel(selectedProps, selectedLayer); // fill in a panel already open
    } catch { /* the panel falls back to the bucket label */ }
  }

  // The other panel fields come from the municipality; this one comes from
  // whoever last edited the map. A name is free text from a stranger, so it is
  // escaped before it goes anywhere near innerHTML.
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function landUseText(props) {
    // A hand correction is shown ahead of the municipality's own code, and
    // says so, because disagreeing with the official record silently would be
    // the one way this feature could mislead.
    if (props.manual_bucket) {
      const label = TYPE_LABELS[props.manual_bucket]?.[lang === "ar" ? 0 : 1] ?? props.manual_bucket;
      const note = props.manual_note ? ` &mdash; ${esc(props.manual_note)}` : "";
      return `${esc(label)}${note}<span class="src-note">${t("manualSource")}</span>`;
    }
    const exact = props.land_use != null ? landUseNames?.get(props.land_use) : null;
    if (exact) return exact;
    // With no land-use code, the parcel's kind is the next best answer -- and
    // it is more specific than the colour it gets. A mosque and a ministry are
    // both coloured "government"; there is no reason to tell the reader
    // "government" when the source said "religious building".
    const kind = KIND_LABELS[props.category];
    if (kind) return kind[lang === "ar" ? 0 : 1];
    const type = plotType(props);
    return TYPE_LABELS[type]?.[lang === "ar" ? 0 : 1] ?? "&mdash;";
  }

  // The parcel kinds, named as the municipality names them. Only the ones that
  // say something a land use wouldn't: 'residential' and 'other_nonres' are
  // left out because they come from the untitled-parcel guess, not from a
  // statement about the parcel.
  const KIND_LABELS = {
    health: ["مبنى صحي", "Health building"],
    education: ["مبنى تعليمي", "Educational building"],
    government: ["مبنى حكومي", "Government building"],
    religious: ["مسجد", "Religious building"],
    public_other: ["مبنى عام", "Public building"],
    coop: ["جمعية", "Co-operative"],
    industrial: ["مبنى صناعي", "Industrial building"],
    farm: ["مزرعة", "Farm"],
    park: ["حديقة", "Park"],
    cemetery: ["مقبرة", "Cemetery"],
    setback: ["إرتداد", "Setback strip"],
    pathway: ["سكة", "Pathway"],
    shared: ["مشاع", "Shared parcel"],
  };

  // The OpenStreetMap row, shown only where it adds something. For مجمع
  // الصالحية this is the only line in the panel that answers the question --
  // KMMaps, Classifcation and EsriNewParcel all have nothing on it.
  //
  // Labelled as OSM rather than blended into the land-use row, because it is a
  // different kind of claim: what someone mapped as being there, not what the
  // municipality designated the land for. Those can disagree, and when they do
  // the reader needs to know which they are looking at.
  function osmRow(props) {
    if (!props.osm_name && !props.osm_kind) return "";
    const kind = props.osm_kind ? OSM_KIND_LABELS[props.osm_kind] : null;
    // Escape the parts, then join -- escaping the joined string would eat the
    // separator entity and print a literal "&mdash;".
    const shown = [props.osm_name, kind?.[lang === "ar" ? 0 : 1] ?? props.osm_kind]
      .filter(Boolean).map(esc).join(" &mdash; ");
    return `<div><dt>${t("osmSays")}</dt><dd>${shown}` +
           `<span class="src-note">${t("osmSource")}</span></dd></div>`;
  }

  // Only the tags the sync keeps. An unmapped tag falls back to its raw form
  // rather than being dropped: "leisure=sports_centre" is still readable, and
  // silently hiding data we hold is worse than showing it untranslated.
  const OSM_KIND_LABELS = {
    "shop=mall": ["مجمع تجاري", "Shopping mall"],
    "shop=department_store": ["متجر كبير", "Department store"],
    "shop=supermarket": ["سوق مركزي", "Supermarket"],
    "shop=car": ["معرض سيارات", "Car dealer"],
    "amenity=bank": ["بنك", "Bank"],
    "amenity=marketplace": ["سوق", "Marketplace"],
    "amenity=fuel": ["محطة وقود", "Petrol station"],
    "amenity=pharmacy": ["صيدلية", "Pharmacy"],
    "amenity=school": ["مدرسة", "School"],
    "amenity=kindergarten": ["روضة", "Kindergarten"],
    "amenity=college": ["كلية", "College"],
    "amenity=university": ["جامعة", "University"],
    "amenity=hospital": ["مستشفى", "Hospital"],
    "amenity=clinic": ["عيادة", "Clinic"],
    "amenity=doctors": ["عيادة", "Doctor's surgery"],
    "amenity=place_of_worship": ["مسجد", "Place of worship"],
    "amenity=restaurant": ["مطعم", "Restaurant"],
    "amenity=cafe": ["مقهى", "Café"],
    "amenity=police": ["مخفر شرطة", "Police station"],
    "amenity=fire_station": ["إطفاء", "Fire station"],
    "amenity=embassy": ["سفارة", "Embassy"],
    "amenity=grave_yard": ["مقبرة", "Cemetery"],
    "tourism=hotel": ["فندق", "Hotel"],
    "office=government": ["جهة حكومية", "Government office"],
    "office=company": ["شركة", "Company"],
    "leisure=park": ["حديقة", "Park"],
    "leisure=garden": ["حديقة", "Garden"],
    "building=commercial": ["مبنى تجاري", "Commercial building"],
    "building=retail": ["مبنى تجاري", "Retail building"],
    "building=warehouse": ["مخزن", "Warehouse"],
    "building=industrial": ["مبنى صناعي", "Industrial building"],
    "building=apartments": ["عمارة سكنية", "Apartment building"],
    "landuse=industrial": ["منطقة صناعية", "Industrial land"],
  };

  function mapsLink(props) {
    const c = plotCentre(props.geom);
    if (!c) return "";
    // Coordinates rather than an address: Google does not know Kuwaiti parcel
    // numbers, and a wrong address is worse than a pin on the right spot.
    // On a phone this hands off to the Google Maps app.
    const url = `https://www.google.com/maps/search/?api=1&query=${c[1].toFixed(6)},${c[0].toFixed(6)}`;
    return `<a class="btn" href="${url}" target="_blank" rel="noopener noreferrer">${t("openInMaps")}</a>`;
  }

  function showPanel(props, layer) {
    // Picks belong to one parcel. showPanel is also how the panel re-renders
    // in place (language switch, a saved correction), so only a genuine change
    // of plot drops them.
    if (selectedProps && selectedProps.global_id !== props.global_id) clearSidePicks();
    selectedProps = props;
    selectedLayer = layer;
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    const nbh = pick(props.neighborhood_ar, props.neighborhood_en);
    const street = pick(props.street_ar, props.street_en);
    const title = pick(props.title_ar, props.title_en);
    // Sides are pickable: click several and the panel totals them. Measuring a
    // frontage that runs along three edges, or the two sides a wall will
    // follow, otherwise means reading numbers off the list and adding them up
    // by hand -- which is exactly the arithmetic this tool exists to avoid.
    const sidesHtml = props.sides.length
      ? `<dd class="sides-list" style="font-weight:400;">${props.sides
          .map((s) =>
            `<button type="button" class="side-row" data-n="${s.n}">` +
            `<b>${s.n}</b> &mdash; ${fmtSide(s.length)}</button>`)
          .join("")}</dd>`
      : "<dd>&mdash;</dd>";
    // Worth saying how many there are when the list is scrolled: otherwise a
    // 93-sided parcel looks like a handful of sides that stop abruptly.
    const sidesLabel =
      props.sides.length > 6
        ? `${t("sides")} <span class="sides-count">(${props.sides.length})</span>`
        : t("sides");
    // Each label/value pair is wrapped so the two-column mobile layout can't
    // strand a value in the other column from its label.
    const row = (label, value) => `<div><dt>${label}</dt><dd>${value}</dd></div>`;
    panelEl.innerHTML =
      row(t("parcel"), props.parcel_no ?? "&mdash;") +
      row(t("block"), props.block_no ?? "&mdash;") +
      row(t("street"), street ?? "&mdash;") +
      row(t("house"), props.house_no ?? "&mdash;") +
      row(t("neighborhood"), nbh ?? "&mdash;") +
      (title ? row(t("title"), title) : "") +
      // Official area from the municipality; the value computed from the
      // polygon is only a fallback where they publish none, because a derived
      // 1000.1 against a recorded 1000 reads as an error.
      row(t("area"), fmtNum(props.measured_area ?? props.computed_area, "m&sup2;")) +
      // The exact use, not the bucket. Plots sharing the "other" colour are
      // precisely the ones where this matters -- it is the only place their
      // classification is visible.
      row(t("landUse"), landUseText(props)) +
      osmRow(props) +
      // Filled in below: it needs a round trip, and the panel should not wait.
      `<div><dt>${t("setback")}</dt><dd id="setbackVal">…</dd></div>` +
      `<div><dt>${sidesLabel}</dt>${sidesHtml}` +
      `<dd id="sideTotal" class="side-total" hidden></dd></div>` +
      `<dd style="margin-top:10px;"><button id="printBtn" type="button">${t("print")}</button>` +
      mapsLink(props) +
      `</dd>` +
      correctionUi(props);
    panelEl.classList.add("visible");
    showSideLabels(props, layer);
    document.getElementById("printBtn").addEventListener("click", () => printPlot(props));
    wireCorrection(props);
    wireSidePicking(props);
    loadSetback(props.global_id);
    // With الارتداد switched on, selecting a plot draws its setbacks straight
    // away -- the point of leaving the mode on is not having to press the
    // button again for every plot.
    if (setbackMode) autoSetback();
  }

  // ---- Adding up sides ----------------------------------------------------
  // Pick several sides and the panel totals them, with the chosen edges drawn
  // on the map so the number on screen is visibly the boundary you meant.
  //
  // The picks are keyed to the plot and cleared whenever the selection changes,
  // because a total carried over from a different parcel would be a plausible
  // wrong answer rather than an obvious one.
  const pickedSides = new Set();
  const pickedLayer = L.layerGroup().addTo(map);

  function clearSidePicks() {
    pickedSides.clear();
    pickedLayer.clearLayers();
  }

  function wireSidePicking(props) {
    const totalEl = document.getElementById("sideTotal");
    for (const btn of panelEl.querySelectorAll(".side-row")) {
      const n = Number(btn.dataset.n);
      if (pickedSides.has(n)) btn.classList.add("picked");
      btn.addEventListener("click", () => {
        if (pickedSides.has(n)) pickedSides.delete(n);
        else pickedSides.add(n);
        btn.classList.toggle("picked", pickedSides.has(n));
        redrawPicks(props);
        renderSideTotal(props, totalEl);
      });
    }
    redrawPicks(props);
    renderSideTotal(props, totalEl);
  }

  function redrawPicks(props) {
    pickedLayer.clearLayers();
    for (const s of props.sides) {
      if (!pickedSides.has(s.n) || !s.a || !s.b) continue;
      L.polyline([[s.a[1], s.a[0]], [s.b[1], s.b[0]]], {
        color: "#1565c0", weight: 6, opacity: 0.75,
        // Decoration only: left interactive it would sit on the plot's own
        // boundary and swallow clicks, the way the red outline once did.
        interactive: false,
      }).addTo(pickedLayer);
    }
  }

  function renderSideTotal(props, el) {
    if (!el) return;
    if (!pickedSides.size) { el.hidden = true; el.innerHTML = ""; return; }
    const chosen = props.sides.filter((s) => pickedSides.has(s.n));
    const total = chosen.reduce((sum, s) => sum + s.length, 0);
    // Same rounding as the individual sides, so the total cannot disagree with
    // the numbers it is visibly the sum of.
    el.innerHTML =
      `<span class="side-total-n">${t("sidesPicked", chosen.length)}</span>` +
      `<b>${fmtSide(total)}</b>` +
      `<button type="button" id="sideClear">${t("clearPicks")}</button>`;
    el.hidden = false;
    document.getElementById("sideClear").addEventListener("click", () => {
      clearSidePicks();
      for (const b of panelEl.querySelectorAll(".side-row")) b.classList.remove("picked");
      renderSideTotal(props, el);
    });
  }

  // ---- Correcting a plot by hand -----------------------------------------
  // Shown only when signed in. The real gate is the grant on set_plot_type,
  // which is revoked from anon -- this just keeps the panel uncluttered for
  // everyone else.
  //
  // It exists because the data ran out: after every municipal layer and
  // OpenStreetMap, around 62,000 ordinary parcels still have no published
  // classification, and some of them are obvious to anyone who knows the city.
  const CORRECTABLE = ["residential", "investment", "mixed", "commercial",
                       "industrial", "storage", "government", "gardens", "other"];

  function correctionUi(props) {
    if (!session) return "";
    const cur = props.manual_bucket ?? "";
    const opts = [`<option value="">${t("typeUnset")}</option>`]
      .concat(CORRECTABLE.map((k) =>
        `<option value="${k}"${k === cur ? " selected" : ""}>` +
        `${TYPE_LABELS[k][lang === "ar" ? 0 : 1]}</option>`))
      .join("");
    return `<div class="correction"><dt>${t("correctType")}</dt><dd>` +
      `<select id="fixType">${opts}</select>` +
      `<input id="fixNote" type="text" maxlength="200" placeholder="${t("notePh")}" ` +
      `value="${esc(props.manual_note ?? "")}">` +
      `<button id="fixSave" type="button">${t("save")}</button>` +
      `<span id="fixMsg" class="fix-msg"></span></dd></div>`;
  }

  function wireCorrection(props) {
    const btn = document.getElementById("fixSave");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const sel = document.getElementById("fixType");
      const note = document.getElementById("fixNote");
      const msg = document.getElementById("fixMsg");
      btn.disabled = true;
      msg.textContent = "…";
      try {
        await authRpc("set_plot_type", {
          gis: props.global_id,
          bucket: sel.value || null,
          note: note.value.trim() || null,
        });
        // Update the plot in place rather than refetching the viewport: a
        // reload would drop the selection and scroll position, and the server
        // has already accepted exactly these values.
        props.manual_bucket = sel.value || null;
        props.manual_note = note.value.trim() || null;
        if (selectedLayer?.feature) {
          selectedLayer.feature.properties.manual_bucket = props.manual_bucket;
          selectedLayer.feature.properties.manual_note = props.manual_note;
          selectedLayer.setStyle(plotStyle(selectedLayer.feature));
        }
        updateLegend();
        showPanel(props, selectedLayer);
      } catch (err) {
        msg.textContent = /401|403/.test(String(err.message)) ? t("signInFirst") : t("saveFailed");
        btn.disabled = false;
      }
    });
  }

  // Distance from the plot to the nearest paved road, measured against the
  // municipality's own road-edge polygons. This is the figure their KME Guide
  // reports, and the one people actually want -- not the distance to a
  // centreline, which is half a carriageway longer.
  //
  // Sequenced so a slow reply for a previously selected plot cannot land in the
  // panel of the one now open.
  let setbackSeq = 0;
  async function loadSetback(gis) {
    const seq = ++setbackSeq;
    const el = () => document.getElementById("setbackVal");
    if (!gis) { if (el()) el().innerHTML = "&mdash;"; return; }
    let rows = [];
    try {
      rows = await api(`rpc/plot_setback?gis=${encodeURIComponent(gis)}`);
    } catch {
      if (seq === setbackSeq && el()) el().innerHTML = "&mdash;";
      return;
    }
    if (seq !== setbackSeq) return;
    const target = el();
    if (!target) return;
    const m = rows?.[0]?.metres;
    // No road within 60 m means the lookup found nothing, not a setback of 0.
    target.innerHTML = m == null ? "&mdash;" : `${Number(m).toFixed(1)} m`;
  }

  // Whatever is currently drawn on the map -- automatic setbacks and any the
  // user placed by hand -- so the sheet shows the measurements they actually
  // took, not just the ones the algorithm would pick.
  function drawnMeasurements() {
    const out = [];
    measurements.eachLayer((pair) => {
      let line = null, text = null;
      pair.eachLayer((l) => {
        if (l.getLatLngs) line = l;
        else if (l.getContent) text = l.getContent();
      });
      if (!line) return;
      const ll = line.getLatLngs();
      if (ll.length < 2) return;
      out.push({
        from: ll[0],
        to: ll[ll.length - 1],
        text: String(text ?? "").replace(/&mdash;/g, "—").replace(/<[^>]*>/g, ""),
      });
    });
    return out;
  }

  // The plot drawn over the basemap, in printed-pixel space.
  function buildPrintMap(props, setbacks) {
    const plan = printMapPlan(props.geom);
    if (!plan) return null;
    const { toPx, urls, zoom } = plan;

    const imgs = urls
      .map((tl) => `<img src="${tl.url}" style="left:${tl.left}px; top:${tl.top}px" crossorigin="anonymous" />`)
      .join("");

    const simple = simplifyRing(props.geom.coordinates[0]);
    const px = simple.map(([lon, lat]) => toPx(lon, lat));
    const pts = px.map((p) => `${p[0]},${p[1]}`).join(" ");
    let cx = 0, cy = 0;
    for (let i = 0; i < px.length - 1; i++) { cx += px[i][0]; cy += px[i][1]; }
    cx /= px.length - 1; cy /= px.length - 1;

    // How much each label can say depends on how much room there is.
    //
    // The old sheet always drew three lines per side -- number, length and
    // setback. On the 24-sided parcel in القبلة that put seventy-two lines of
    // text along a boundary a few hundred pixels round, and the map became an
    // unreadable smear. The lengths are in the table below regardless, so when
    // the sides are packed tightly the map keeps only what the table cannot
    // give: which edge is which.
    //
    // The threshold is the actual spacing between labels on the page, not a
    // guess at the side count: four long sides and forty short ones are very
    // different pictures.
    const sides = props.sides ?? [];
    let minGap = Infinity;
    for (let i = 0; i < sides.length && px[i] && px[i + 1]; i++) {
      minGap = Math.min(minGap, Math.hypot(px[i + 1][0] - px[i][0], px[i + 1][1] - px[i][1]));
    }
    const detail = minGap >= 46 ? "full" : minGap >= 20 ? "number" : "none";

    const sideLabels = detail === "none" ? "" : sides
      .map((s, i) => {
        if (!px[i] || !px[i + 1]) return "";
        const mx = (px[i][0] + px[i + 1][0]) / 2;
        const my = (px[i][1] + px[i + 1][1]) / 2;
        const dx = mx - cx, dy = my - cy;
        const len = Math.hypot(dx, dy) || 1;
        const out = detail === "full" ? 22 : 13;
        const lx = mx + (dx / len) * out, ly = my + (dy / len) * out;
        const sb = setbacks?.get(s.n);
        if (detail === "number") {
          return `<g text-anchor="middle"><text x="${lx}" y="${ly}" font-size="10" font-weight="700" fill="#17211b" stroke="#fff" stroke-width="2.5" paint-order="stroke">${s.n}</text></g>`;
        }
        return `<g text-anchor="middle">
          <text x="${lx}" y="${ly}" font-size="13" font-weight="700" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${s.n}</text>
          <text x="${lx}" y="${ly + 13}" font-size="11" fill="#1d2b22" stroke="#fff" stroke-width="3" paint-order="stroke">${fmtSide(s.length).replace("&mdash;", "—")}</text>
          ${sb == null ? "" : `<text x="${lx}" y="${ly + 26}" font-size="10.5" font-weight="700" fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">${sb.toFixed(2)} m</text>`}
        </g>`;
      })
      .join("");

    // Sides picked on screen are drawn on the printed plan in the same blue,
    // so the total printed underneath is visibly the boundary it refers to.
    const pickedOnPlan = sides
      .filter((s) => pickedSides.has(s.n))
      .map((s, _, __) => {
        const i = sides.indexOf(s);
        if (!px[i] || !px[i + 1]) return "";
        return `<line x1="${px[i][0]}" y1="${px[i][1]}" x2="${px[i + 1][0]}" y2="${px[i + 1][1]}" stroke="#1565c0" stroke-width="5" stroke-linecap="round" opacity="0.8" />`;
      })
      .join("");

    // The measurements as drawn, in the same red as on screen.
    const drawn = drawnMeasurements()
      .map((m) => {
        const [ax, ay] = toPx(m.from.lng, m.from.lat);
        const [bx, by] = toPx(m.to.lng, m.to.lat);
        return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#c0392b" stroke-width="2.5" />
          <circle cx="${ax}" cy="${ay}" r="2.8" fill="#c0392b" />
          <circle cx="${bx}" cy="${by}" r="2.8" fill="#c0392b" />
          <text x="${(ax + bx) / 2}" y="${(ay + by) / 2 - 6}" font-size="11" font-weight="700" text-anchor="middle"
                fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">${m.text}</text>`;
      })
      .join("");

    const bar = printScaleBar(zoom, L.latLngBounds(props.geom.coordinates[0].map(([lo, la]) => L.latLng(la, lo))).getCenter().lat);
    const by0 = PRINT_H - 16;

    return `<div class="plan">${imgs}
      <svg viewBox="0 0 ${PRINT_W} ${PRINT_H}" xmlns="http://www.w3.org/2000/svg">
        <polygon points="${pts}" fill="rgba(60,110,71,0.18)" stroke="#2f5d3a" stroke-width="2.5" />
        ${pickedOnPlan}
        ${sideLabels}
        ${drawn}
        <g transform="translate(${PRINT_W - 34},26)">
          <path d="M0,-16 L6,8 L0,3 L-6,8 Z" fill="#17211b" stroke="#fff" stroke-width="1.5" paint-order="stroke" />
          <text y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${t("north")}</text>
        </g>
        <g transform="translate(14,${by0})">
          <line x1="0" y1="0" x2="${bar.px}" y2="0" stroke="#17211b" stroke-width="3" />
          <line x1="0" y1="-5" x2="0" y2="5" stroke="#17211b" stroke-width="3" />
          <line x1="${bar.px}" y1="-5" x2="${bar.px}" y2="5" stroke="#17211b" stroke-width="3" />
          <text x="${bar.px / 2}" y="-9" font-size="11" font-weight="700" text-anchor="middle" fill="#17211b" stroke="#fff" stroke-width="3" paint-order="stroke">${bar.metres} m</text>
        </g>
      </svg>
      <span class="attrib">${plan.sat ? "Imagery © Esri" : "© OpenStreetMap"}</span>
    </div>`;
  }

  // Chrome will happily print before tiles arrive, so wait for them (briefly --
  // a slow tile server must not block the dialog indefinitely).
  function preloadTiles(urls, timeoutMs = 7000) {
    return Promise.race([
      Promise.all(urls.map((u) => new Promise((res) => {
        const im = new Image();
        im.onload = im.onerror = res;
        im.src = u;
      }))),
      new Promise((res) => setTimeout(res, timeoutMs)),
    ]);
  }

  async function printPlot(props) {
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    const nbh = pick(props.neighborhood_ar, props.neighborhood_en);
    const street = pick(props.street_ar, props.street_en);
    // Setbacks are computed here rather than read off whatever happens to be
    // drawn, so a printout is complete even if nothing was measured on screen.
    // They need the kerb layer, so zoomed out they are simply absent.
    const ctx = setbackContext();
    const setbacks = new Map();
    if (ctx) {
      for (const s of sideSetbacks(props, ctx)) {
        if (s.metres != null) setbacks.set(s.n, s.metres);
      }
    }
    // A column of 24 dashes is not information. The setback column appears only
    // when some side actually has one.
    const anySetback = props.sides.some((s) => setbacks.has(s.n));
    // Long lists ran down a whole second page one row at a time. Split into
    // columns of at most 12 so a 24-sided parcel is two short columns, not a
    // ribbon.
    const PER_COL = 12;
    const cols = [];
    for (let i = 0; i < props.sides.length; i += PER_COL) cols.push(props.sides.slice(i, i + PER_COL));
    const sidesTables = cols
      .map((col) => {
        const body = col
          .map((s) => {
            const sb = setbacks.get(s.n);
            const picked = pickedSides.has(s.n) ? ' class="picked"' : "";
            return `<tr${picked}><td>${s.n}</td><td>${fmtSide(s.length)}</td>` +
                   (anySetback ? `<td>${sb == null ? "—" : sb.toFixed(2) + " m"}</td>` : "") + `</tr>`;
          })
          .join("");
        return `<table class="sides"><thead><tr><th>${t("side")}</th><th>${t("length")}</th>` +
               (anySetback ? `<th>${t("setbackCol")}</th>` : "") +
               `</tr></thead><tbody>${body}</tbody></table>`;
      })
      .join("");

    const perimeter = props.sides.reduce((sum, s) => sum + s.length, 0);
    // Sides picked on screen are carried onto the sheet: the printout should be
    // what the reader was looking at, and the total is usually the reason they
    // pressed Print.
    const chosen = props.sides.filter((s) => pickedSides.has(s.n));
    const chosenTotal = chosen.reduce((sum, s) => sum + s.length, 0);

    const plan = printMapPlan(props.geom);
    const planHtml = plan ? buildPrintMap(props, setbacks) : `<div class="diagram">${buildPlotSvg(props.geom, props.sides, setbacks)}</div>`;
    const area = props.measured_area ?? props.computed_area;

    // One heading, then one table. The old sheet said the parcel, block,
    // neighbourhood and street three times over -- in the title, again in a
    // subtitle, and again in the table under it.
    const cell = (label, value) => `<div class="cell"><dt>${label}</dt><dd>${value}</dd></div>`;
    document.getElementById("printArea").innerHTML = `
      <h1>${t("parcel")} ${props.parcel_no ?? "—"} &mdash; ${t("block")} ${props.block_no ?? "—"}</h1>
      <div class="meta">
        ${cell(t("neighborhood"), nbh ?? "—")}
        ${cell(t("street"), street ?? "—")}
        ${cell(t("house"), props.house_no ?? "—")}
        ${cell(t("area"), area == null ? "—" : fmtNum(area, "m&sup2;"))}
        ${cell(t("landUse"), landUseText(props))}
        ${cell(t("perimeter"), fmtSide(perimeter))}
      </div>
      ${planHtml}
      <div class="sides-wrap">${sidesTables}</div>
      ${chosen.length
        ? `<p class="picked-total"><b>${t("sidesPicked", chosen.length)}</b> ` +
          `(${chosen.map((s) => s.n).join(" + ")}) = <b>${fmtSide(chosenTotal)}</b></p>`
        : ""}
      ${ctx ? "" : `<p class="note">${t("setbackUnavailable")}</p>`}
      <p class="foot">${t("source")}. ${t("printed")}: ${new Date().toLocaleString(lang === "ar" ? "ar-KW" : "en-GB")}.</p>
    `;
    if (plan) await preloadTiles(plan.urls.map((u) => u.url));
    window.print();
  }

  const PLOT_LIMIT = 1000;
  let plotLayer = null;

  // Only the categories actually on screen. The full list is sixteen entries,
  // and in an ordinary residential view fourteen of them would be noise --
  // a legend nobody reads explains nothing.
  function updateLegend() {
    const el = document.getElementById("legend");
    if (!el) return;
    if (!plotFill || !labelledFeatures.length) { el.hidden = true; return; }

    const counts = new Map();
    let osmCount = 0;
    for (const f of labelledFeatures) {
      const t = plotType(f.properties);
      counts.set(t, (counts.get(t) ?? 0) + 1);
      if (isOsmDerived(f.properties)) osmCount++;
    }
    const rows = [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([type, n]) => {
        const label = (TYPE_LABELS[type] ?? TYPE_LABELS.unknown)[lang === "ar" ? 0 : 1];
        return `<div class="row"><span class="sw" style="background:${catColor(type)}"></span>` +
               `<span>${label}</span><span class="n">${n.toLocaleString()}</span></div>`;
      })
      .join("");
    // The counts above mix two kinds of evidence. Say how much of what is on
    // screen is coloured on a volunteer's say-so rather than the
    // municipality's, so the legend isn't quietly overstating its authority.
    el.innerHTML = rows + (osmCount ? `<div class="legend-note">${t("legendOsm", osmCount)}</div>` : "");
    el.hidden = false;
  }

  // Plot shading can be switched off, which makes the basemap -- satellite
  // especially -- readable underneath. Outlines stay: without them there is
  // nothing to click. Hover still gives feedback when shading is off, as a
  // heavier outline rather than a green wash, so plots remain discoverable
  // without bringing back the colour the user turned off.
  let plotFill = storage.get("kwplots-fill") !== "off";

  // Eight types get their own colour; everything else shares one. Residential
  // keeps the green it always had -- it is the overwhelming majority, and
  // recolouring it would make every familiar view look wrong.
  const TYPE_COLORS = {
    residential: "#a9c9ab",
    investment:  "#7e57c2",
    mixed:       "#ec9a3c",
    commercial:  "#e05a5a",
    industrial:  "#a1662f",
    storage:     "#6d7f8c",
    government:  "#2c4f8a",
    gardens:     "#4caf50",
    other:       "#c9c4b6",
    unknown:     "#ddd9d0",
  };
  const TYPE_LABELS = {
    residential: ["سكني", "Residential"],
    investment:  ["استثماري", "Investment"],
    mixed:       ["تجاري + استثماري", "Mixed"],
    commercial:  ["تجاري", "Commercial"],
    industrial:  ["صناعي", "Industrial"],
    storage:     ["مخازن", "Storage"],
    government:  ["حكومي", "Government"],
    gardens:     ["حدائق", "Gardens"],
    other:       ["أخرى", "Other"],
    unknown:     ["غير معروف", "Not classified"],
  };
  const MAIN_TYPES = ["residential", "investment", "mixed", "commercial",
                      "industrial", "storage", "government", "gardens"];

  // What the parcel's own kind implies when no land use was ever recorded.
  // The municipality states these outright -- they are not a guess -- so they
  // are a step ABOVE OpenStreetMap in the order of preference, and below a
  // real land-use code only because a code is more specific.
  //
  // Farms, setbacks, pathways and shared parcels share the "other" colour:
  // none is one of the eight, and the panel names each one exactly.
  const KIND_TYPE = {
    health: "government", education: "government", government: "government",
    religious: "government", public_other: "government", coop: "government",
    industrial: "industrial",
    park: "gardens", cemetery: "other",
    farm: "other", setback: "other", pathway: "other", shared: "other",
    other_nonres: "other",
  };

  // Which colour a plot gets. Gardens first: there is no garden among the 55
  // land-use codes, so they are recognised by the parcel's own classification
  // or the municipality's Class field, and that should win over whatever use
  // the plot is zoned for.
  //
  // "unknown" and "other" are kept apart on purpose. Other means the
  // municipality classified it as something outside the eight; unknown means
  // no classification reached us -- about a quarter of plots, mostly ones
  // created after the dataset that carries land use. Merging them would present
  // a gap in our data as a fact about the plot.
  function plotType(p) {
    if (!p) return "unknown";
    // A correction someone made by hand outranks everything: it is the only
    // source where a person actually looked at the plot.
    if (p.manual_bucket) return p.manual_bucket;
    if (p.category === "park" || p.land_class === 2) return "gardens";
    if (p.land_bucket && MAIN_TYPES.includes(p.land_bucket)) return p.land_bucket;
    if (p.land_bucket === "other" || p.land_use != null) return "other";
    // No land use -- but the parcel's own kind often says plenty, and we were
    // throwing it away. A parcel the municipality files as "Governmental
    // Parcel - Religious Building" was rendering as "not classified", and
    // 39% of the unclassified pile is exactly that: 27,655 government
    // parcels and 13,804 farms whose type we already hold in `subtype`.
    const fromKind = KIND_TYPE[p.category];
    if (fromKind) return fromKind;
    // Nobody official has classified this one. OpenStreetMap sometimes has,
    // and the server only fills osm_bucket where land_use is null, so this
    // can never contradict the municipality -- only speak where it is silent.
    // The panel names the source, so the colour is never the whole claim.
    if (p.osm_bucket && MAIN_TYPES.includes(p.osm_bucket)) return p.osm_bucket;
    return "unknown";
  }
  // True where the colour came from OpenStreetMap rather than the municipality.
  const isOsmDerived = (p) =>
    !!p && p.land_use == null && p.land_class !== 2 && p.category !== "park" && !!p.osm_bucket;
  const catColor = (t) => TYPE_COLORS[t] ?? TYPE_COLORS.unknown;

  const plotStyle = (feature) =>
    plotFill
      ? {
          color: "#3c6e47",
          weight: 1,
          fillColor: catColor(plotType(feature?.properties)),
          fillOpacity: 0.55,
        }
      : { color: "#3c6e47", weight: 1, fillOpacity: 0 };
  const plotHoverStyle = () =>
    plotFill ? { fillOpacity: 0.85 } : { weight: 2.5, fillOpacity: 0 };

  // Hides the red road-edge lines without unloading them. A CSS class on the
  // map container rather than removing layers, so the snap targets built from
  // the same data stay live and the ruler keeps snapping to the kerb.
  function setEdgeLines(on) {
    storage.set("kwplots-edges", on ? "on" : "off");
    map.getContainer().classList.toggle("edges-off", !on);
  }

  function setPlotFill(on) {
    plotFill = on;
    storage.set("kwplots-fill", on ? "on" : "off");
    // setStyle with a function re-evaluates per feature, so each plot keeps
    // its own colour instead of all of them collapsing to one.
    if (plotLayer) plotLayer.setStyle(plotStyle);
    updateLegend();
  }

  function rowsToFeatures(rows) {
    return rows
      .filter((r) => r.geom)
      .map((r) => ({
        type: "Feature",
        geometry: r.geom,
        properties: {
          global_id: r.global_id,
          parcel_no: r.parcel_no,
          paci_no: r.paci_no,
          block_no: r.block_no,
          neighborhood_ar: r.neighborhood_ar,
          neighborhood_en: r.neighborhood_en,
          measured_area: r.measured_area,
          shape_area: r.shape_area,
          shape_length: r.shape_length,
          geom: r.geom,
          house_no: r.house_no,
          street_ar: r.street_ar,
          street_en: r.street_en,
          title_ar: r.title_ar,
          title_en: r.title_en,
          // Classified server-side so the map, the area report and the
          // highlight all read the same answer.
          category: r.category,
          land_use: r.land_use,
          land_bucket: r.land_bucket,
          land_class: r.land_class,
          // OpenStreetMap's reading, carried separately from the
          // municipality's and only ever used where theirs is silent.
          osm_name: r.osm_name,
          osm_kind: r.osm_kind,
          osm_bucket: r.osm_bucket,
          manual_bucket: r.manual_bucket,
          manual_note: r.manual_note,
          computed_area: computeAreaM2(r.geom),
          sides: computeSideDetails(r.geom),
        },
      }));
  }

  // Renders a fresh set of plots, replacing whatever was shown before, and
  // rebuilds the ruler's snap targets to match. Plot snap targets are rebuilt
  // (not appended) so stale geometry from a previous area can't be snapped to.
  function renderPlots(features, { highlightGlobalId = null } = {}) {
    if (plotLayer) map.removeLayer(plotLayer);
    snapVerts.length = 0;
    for (let i = snapSegs.length - 1; i >= 0; i--) {
      if (snapSegs[i].kind === "plot") snapSegs.splice(i, 1);
    }
    for (const f of features) {
      const ring = f.geometry?.coordinates?.[0];
      if (!ring) continue;
      for (let i = 0; i < ring.length - 1; i++) {
        snapVerts.push({ p: ring[i], kind: "plot" });
        snapSegs.push({ a: ring[i], b: ring[i + 1], kind: "plot" });
      }
    }

    let matched = null;
    plotLayer = L.geoJSON(
      { type: "FeatureCollection", features },
      {
        style: plotStyle,
        onEachFeature: (feature, lyr) => {
          if (highlightGlobalId && feature.properties.global_id === highlightGlobalId) {
            matched = { feature, lyr };
          }
          lyr.on("click", () => {
            plotJustClicked = true;
            if (measuring) return;
            // Clicking the selected plot again lets go of it. Without this the
            // only ways out were Clear or finding empty map to click, and on a
            // dense block there isn't any empty map to click.
            if (selectedProps && selectedProps.global_id === feature.properties.global_id) {
              clearSelection();
              return;
            }
            showPanel(feature.properties, lyr);
          });
          lyr.on("mouseover", () => lyr.setStyle(plotHoverStyle()));
          lyr.on("mouseout", () => lyr.setStyle(plotStyle(feature)));
        },
      }
    ).addTo(map);

    labelledFeatures = features;
    updateParcelLabels();
    updateLegend();

    if (matched) showPanel(matched.feature.properties, matched.lyr);
    return plotLayer;
  }

  async function api(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase query failed: ${res.status} ${res.statusText}`);
    return res.json();
  }

  // ---- Sign-in -----------------------------------------------------------
  // The area report is owner-only. The real gate is the database grant --
  // area_report is executable by `authenticated` and revoked from `anon` -- so
  // a signed-out visitor gets 401 from the endpoint whatever the page does.
  // Hiding the button is a convenience, not the lock: the key is in the page
  // source and anyone can call the API directly.
  let session = null; // { access_token, refresh_token, email }

  function loadSession() {
    try {
      const raw = storage.get("kwplots-session");
      session = raw ? JSON.parse(raw) : null;
    } catch { session = null; }
    return session;
  }
  function saveSession(s) {
    session = s;
    if (s) storage.set("kwplots-session", JSON.stringify(s));
    else storage.set("kwplots-session", "");
    applyAuthUi();
  }

  async function signIn(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error_description || body.msg || `HTTP ${res.status}`);
    saveSession({
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      email: body.user?.email ?? email,
    });
  }

  // Access tokens expire after an hour, so a session restored from a previous
  // visit is usually stale. Refreshing on 401 keeps the user signed in instead
  // of bouncing them to the login form mid-measurement.
  async function refreshSession() {
    if (!session?.refresh_token) return false;
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) { saveSession(null); return false; }
    const body = await res.json();
    saveSession({
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      email: body.user?.email ?? session.email,
    });
    return true;
  }

  // POST to an RPC as the signed-in user, retrying once after a refresh.
  async function authRpc(fn, payload, retried = false) {
    if (!session) throw new Error("not signed in");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: {
        apikey: ANON_KEY,
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    });
    if (res.status === 401 && !retried && (await refreshSession())) {
      return authRpc(fn, payload, true);
    }
    if (!res.ok) throw new Error(`${fn} failed: ${res.status}`);
    // A void-returning function replies 204 with no body, and res.json()
    // throws on that. Callers that expect rows still get them.
    if (res.status === 204) return null;
    return res.json().catch(() => null);
  }

  // Loads only what's inside the current view, via the PostGIS bbox function.
  async function loadPlotsInView({ highlightGlobalId = null } = {}) {
    const b = map.getBounds();
    const rows = await api(
      `rpc/plots_in_bbox?min_lon=${b.getWest()}&min_lat=${b.getSouth()}` +
        `&max_lon=${b.getEast()}&max_lat=${b.getNorth()}&max_rows=${PLOT_LIMIT}`
    );
    const features = rowsToFeatures(rows);
    renderPlots(features, { highlightGlobalId });
    // Plot counts were noise in the header; only the "too many, zoom in"
    // case still says anything, because that one is actionable.
    statusEl.textContent = features.length >= PLOT_LIMIT ? t("limitReached", features.length) : "";
    return features;
  }

  // The kerb: paved-road polygons from the municipality's Road Edge Area layer.
  // Only the trafficked surfaces count as "the street" -- islands, pavements
  // and footpaths sit inside or beside the road and are not what a setback is
  // measured to. They are still drawn faintly for context.
  //
  // Restricting this to 7 (Road) was wrong. Nuzha block 1 parcel 51 fronts
  // طريق المغرب السريع, which is an Expressway (3) 18.86 m away and is exactly
  // what KME measures there (18.63 m) -- but the nearest Road was 89 m off, so
  // that frontage got no setback line and nothing to snap to at all.
  const KERB_SUBTYPES = new Set([3, 7, 8, 9]); // Expressway, Road, Roundabout, Service Road
  // A viewport's worth of road polygons is ~1.5 s on the wire -- they carry far
  // more vertices than the parcels do. Nobody measures a setback zoomed out, so
  // below this the layer is skipped entirely rather than made to slow down
  // panning on a phone.
  const KERB_MIN_ZOOM = 16;
  async function loadKerbsInView() {
    if (map.getZoom() < KERB_MIN_ZOOM) {
      kerbLayer.clearLayers();
      for (let i = snapSegs.length - 1; i >= 0; i--) {
        if (snapSegs[i].kind === "kerb") snapSegs.splice(i, 1);
      }
      return;
    }
    const b = map.getBounds();
    const rows = await api(
      `rpc/road_edges_in_bbox?min_lon=${b.getWest()}&min_lat=${b.getSouth()}` +
        `&max_lon=${b.getEast()}&max_lat=${b.getNorth()}`
    ).catch(() => []);

    kerbLayer.clearLayers();
    for (let i = snapSegs.length - 1; i >= 0; i--) {
      if (snapSegs[i].kind === "kerb") snapSegs.splice(i, 1);
    }

    const roads = [], other = [];
    for (const row of rows) {
      if (!row.geom) continue;
      const isRoad = KERB_SUBTYPES.has(row.subtype);
      (isRoad ? roads : other).push({
        type: "Feature", geometry: row.geom, properties: { name_ar: row.name_ar },
      });
      if (!isRoad) continue;
      const polys = row.geom.type === "MultiPolygon" ? row.geom.coordinates : [row.geom.coordinates];
      for (const poly of polys)
        for (const ring of poly)
          for (let i = 0; i < ring.length - 1; i++)
            snapSegs.push({ a: ring[i], b: ring[i + 1], kind: "kerb" });
    }

    // className tags the rendered paths so the Road edges toggle can hide them
    // in CSS. display:none also stops them taking pointer events, so a hidden
    // line can't show its street-name tooltip on hover either.
    L.geoJSON(
      { type: "FeatureCollection", features: other },
      {
        style: { color: "#95a5a6", weight: 1, fill: false, opacity: 0.5, className: "kerb-line" },
        interactive: false,
      }
    ).addTo(kerbLayer);
    L.geoJSON(
      { type: "FeatureCollection", features: roads },
      {
        style: { color: "#c0392b", weight: 1.5, fill: false, opacity: 0.85, className: "kerb-line" },
        onEachFeature: (f, lyr) => {
          if (f.properties.name_ar) lyr.bindTooltip(f.properties.name_ar);
        },
      }
    ).addTo(kerbLayer);
  }

  // ---- Search -------------------------------------------------------------
  // Accepts, in order of specificity:
  //   "2/64"          -> block 2, parcel 64
  //   digits          -> PACI number, else parcel number
  //   anything else   -> neighbourhood name (Arabic or English, partial)
  // On a hit it centres the map on the match, loads the plots around it, and
  // opens that plot's panel.
  const q = (s) => encodeURIComponent(s);

  async function runSearch(rawTerm) {
    const term = rawTerm.trim();
    if (!term) return;
    statusEl.textContent = t("searching");
    errEl.classList.remove("visible");

    const blockParcel = term.match(/^(\S+)\s*[/\-]\s*(\S+)$/);
    let rows = [];

    // All reads go through bounded RPCs -- the tables themselves are not
    // readable by the public key, so nobody can pull the whole dataset in one
    // request the way `?limit=100000` would have allowed.
    if (blockParcel) {
      rows = await api(
        `rpc/plot_by_block_parcel?blk=${q(blockParcel[1])}&par=${q(blockParcel[2])}`
      );
    } else if (/^\d+$/.test(term)) {
      rows = await api(`rpc/plot_by_parcel_no?par=${q(term)}`);
    } else {
      // Free text: street name, neighbourhood, or the name of a named feature
      // (mosque, co-op, tower), in either language. Several parcels usually
      // match a street, so these come back as a list to choose from.
      const hits = await api(`rpc/search_address?term=${q(term)}&max_rows=25`);
      if (hits.length) return showResults(hits, term);
      rows = [];
    }

    if (!rows.length) {
      statusEl.textContent = t("noMatch");
      errEl.textContent = t("noMatchHint", term);
      errEl.classList.add("visible");
      return;
    }
    // Block and parcel numbers repeat across the country -- dozens of
    // neighbourhoods have a block 6 -- so more than one match means the term
    // is ambiguous and the user has to choose. Silently taking the first was
    // how "6/10" landed in a random governorate.
    if (rows.length > 1) {
      return showResults(rows.map(plotToResult), term);
    }
    hideResults();
    await gotoPlot(rows[0]);
  }

  // Shapes a plot row like a search_address hit so both can share the list.
  function plotToResult(p) {
    const ring = p.geom?.coordinates?.[0] ?? [];
    const lat = ring.length ? ring.reduce((s, c) => s + c[1], 0) / ring.length : null;
    const lon = ring.length ? ring.reduce((s, c) => s + c[0], 0) / ring.length : null;
    return {
      global_id: p.global_id,
      parcel_no: p.parcel_no,
      block_no: p.block_no,
      house_no: p.house_no,
      street_ar: p.street_ar,
      street_en: p.street_en,
      neighborhood_ar: p.neighborhood_ar,
      neighborhood_en: p.neighborhood_en,
      governorate: p.governorate,
      lat,
      lon,
    };
  }

  // ---- Result list --------------------------------------------------------
  const resultsEl = document.getElementById("results");

  function hideResults() {
    resultsEl.classList.remove("visible");
    resultsEl.innerHTML = "";
  }

  function showResults(hits, term) {
    const pick = (ar, en) => (lang === "ar" ? ar || en : en || ar);
    statusEl.textContent = "";
    errEl.classList.remove("visible");
    resultsEl.innerHTML =
      `<div class="res-head">${t("results", hits.length, term)}</div>` +
      hits
        .map((h, i) => {
          const street = pick(h.street_ar, h.street_en);
          const nbh = pick(h.neighborhood_ar, h.neighborhood_en);
          // Lead with the parcel's identity, then where it is -- the same
          // result can be reached by parcel number or by street name, and
          // both readings need the area to tell duplicates apart.
          const line1 =
            [
              h.parcel_no ? `${t("parcel")} ${h.parcel_no}` : null,
              h.block_no ? `${t("block")} ${h.block_no}` : null,
            ].filter(Boolean).join(" · ") || street || "—";
          const line2 = [
            [street, h.house_no ? `${t("house")} ${h.house_no}` : null].filter(Boolean).join(" "),
            nbh,
            h.governorate,
          ].filter(Boolean).join(" · ");
          return `<button type="button" class="res-item" data-i="${i}">
                    <b>${line1}</b><span>${line2}</span>
                  </button>`;
        })
        .join("");
    resultsEl.classList.add("visible");

    for (const btn of resultsEl.querySelectorAll(".res-item")) {
      btn.addEventListener("click", async () => {
        const h = hits[Number(btn.dataset.i)];
        hideResults();
        map.setView([h.lat, h.lon], 18, { animate: false });
        await new Promise((r) => setTimeout(r, 120));
        await loadViewport({ highlightGlobalId: h.global_id });
      });
    }
  }

  // Centres on a plot, loads the plots around it, and opens its panel.
  async function gotoPlot(hit) {
    const ring = hit.geom?.coordinates?.[0] ?? [];
    if (!ring.length) return;
    const lat = ring.reduce((s, p) => s + p[1], 0) / ring.length;
    const lng = ring.reduce((s, p) => s + p[0], 0) / ring.length;

    // animate:false jumps straight there -- a search result should land
    // immediately, and it avoids depending on animation frames.
    skipNextMoveLoad = true;
    map.setView([lat, lng], 18, { animate: false });
    // Wait a tick so the new bounds have settled before asking for that area.
    await new Promise((r) => setTimeout(r, 120));
    await loadViewport({ highlightGlobalId: hit.global_id });
  }

  document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    clearTimeout(suggestTimer);
    runSearch(document.getElementById("searchInput").value).catch((err) => {
      statusEl.textContent = t("noMatch");
      errEl.textContent = err.message;
      errEl.classList.add("visible");
      console.error(err);
    });
  });

  // Live suggestions while typing. Deliberately only *lists* matches -- it
  // never navigates, because jumping the map on a keystroke while someone is
  // still typing is disorienting. Enter or a click commits.
  let suggestTimer = null;
  let suggestSeq = 0;
  const searchInputEl = document.getElementById("searchInput");

  searchInputEl.addEventListener("input", () => {
    clearTimeout(suggestTimer);
    const term = searchInputEl.value.trim();
    if (term.length < 2) return hideResults();

    suggestTimer = setTimeout(async () => {
      const seq = ++suggestSeq;
      try {
        const bp = term.match(/^(\S+)\s*[/\-]\s*(\S+)$/);
        let hits;
        if (bp) {
          const rows = await api(`rpc/plot_by_block_parcel?blk=${q(bp[1])}&par=${q(bp[2])}`);
          hits = rows.map(plotToResult);
        } else if (/^\d+$/.test(term)) {
          const rows = await api(`rpc/plot_by_parcel_no?par=${q(term)}`);
          hits = rows.map(plotToResult);
        } else {
          hits = await api(`rpc/search_address?term=${q(term)}&max_rows=25`);
        }
        // a slower earlier request must not overwrite a newer one
        if (seq !== suggestSeq) return;
        if (hits.length) showResults(hits, term);
        else hideResults();
      } catch (err) {
        console.error(err);
      }
    }, 300);
  });

  // ---- Address cascade ----------------------------------------------------
  // Neighbourhood -> block -> parcel, each list fetched from the server so it
  // stays correct as the dataset grows. (Governorate becomes a fourth level
  // once the national parcel layers are synced; this data has only one.)
  const selGov = document.getElementById("selGov");
  const selNbh = document.getElementById("selNbh");
  const selBlk = document.getElementById("selBlk");
  const selPar = document.getElementById("selPar");
  let govRows = [];
  let nbhRows = [];

  function nbhLabel(r) {
    return (lang === "ar" ? r.name_ar || r.name_en : r.name_en || r.name_ar) || "—";
  }

  function refreshSelectPlaceholders() {
    if (!selNbh) return;
    if (selGov.options.length) selGov.options[0].textContent = t("selGov");
    if (selNbh.options.length) selNbh.options[0].textContent = t("selNbh");
    if (selBlk.options.length) selBlk.options[0].textContent = t("selBlk");
    if (selPar.options.length) selPar.options[0].textContent = t("selPar");
    for (let i = 0; i < govRows.length; i++) {
      if (selGov.options[i + 1]) selGov.options[i + 1].textContent = nbhLabel(govRows[i]);
    }
    for (let i = 0; i < nbhRows.length; i++) {
      if (selNbh.options[i + 1]) selNbh.options[i + 1].textContent = nbhLabel(nbhRows[i]);
    }
    // The comboboxes show the option text, so they have to be repainted after
    // a language switch or they keep the previous language's labels.
    for (const s of [selGov, selNbh, selBlk, selPar]) s._combo?.sync();
  }

  function fillSelect(sel, placeholder, items, valueOf, labelOf) {
    sel.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = placeholder;
    sel.appendChild(ph);
    for (const it of items) {
      const o = document.createElement("option");
      o.value = valueOf(it);
      o.textContent = labelOf(it);
      sel.appendChild(o);
    }
    sel.disabled = items.length === 0;
    sel._combo?.sync();
  }

  // ---- Filterable dropdowns ----------------------------------------------
  // A native <select> cannot be typed into, and some neighbourhoods carry
  // hundreds of blocks and parcels, so picking one meant scrolling a huge
  // list. Each select gets a text box in front of it that narrows the list to
  // what actually matches as you type. The <select> itself is kept (hidden)
  // and still holds the value, so nothing reading `.value` or listening for
  // `change` had to change.
  function makeCombo(sel) {
    const wrap = document.createElement("div");
