<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>الاستخدام</title>
<!--
  What the site is used for, and by how many people. Private, like /laws.html.

  Two different readers, which is why the page is in two halves:

    the monthly table is the sale file -- visitors, whether they came back, and
    what the month cost to serve, kept forever and frozen month by month so it
    survives the raw rows expiring;

    everything under it is for deciding what to build next, and the list of
    searches that found nothing is the most useful thing on the page.

  The lock is in the database. usage_report and usage_months are granted to
  `authenticated` and then check is_owner() themselves, so a signed-out
  visitor gets 401 and a signed-in stranger gets an error rather than a
  smaller report. noindex and a name nothing links to are tidiness, not the
  lock.

  Nothing here identifies a person: no IP address is stored, the visitor id is
  a random string the browser made up for itself, and the city is the city
  Cloudflare resolved at the edge, which is the network's city rather than
  anyone's address.
-->
<style>
  :root {
    --paper: #fbfaf7;
    --ink: #17211b;
    --muted: #5b6b60;
    --line: #d9d5cb;
    --accent: #3c6e47;
    --wash: #eef3ef;
    --warn: #a33;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 14px/1.6 "Segoe UI", Tahoma, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header .spacer { flex: 1; }
  button, input, select {
    font: inherit; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink); padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--wash); }
  #signOut, #signInBtn { border-color: var(--accent); color: var(--accent); }
  #backMap {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; text-decoration: none; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; background: #fff; color: var(--accent);
  }
  #backMap:hover { background: var(--wash); border-color: var(--accent); }

  /* Sign-in gate -- the same one as /laws.html, sharing the same session. */
  #gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #gate form {
    width: min(340px, 100%); background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,0.07);
  }
  #gate h2 { margin: 0 0 4px; font-size: 15px; }
  #gate p { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  #gate label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  #gate input { width: 100%; }
  #gate button { width: 100%; margin-top: 14px; background: var(--accent); color: #fff; border-color: var(--accent); }
  #gateErr { color: var(--warn); font-size: 12px; margin-top: 10px; min-height: 1em; }

  #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #controls {
    display: flex; gap: 8px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  /* Segmented rather than a dropdown: the window is the one control on the
     page, and which one is active changes every number below it. */
  #range { display: flex; }
  #range button { border-radius: 0; font-size: 12px; padding: 6px 12px; margin-inline-start: -1px; }
  #range button:first-child { border-start-start-radius: 6px; border-end-start-radius: 6px; margin: 0; }
  #range button:last-child { border-start-end-radius: 6px; border-end-end-radius: 6px; }
  #range button.active { background: var(--wash); border-color: var(--accent); color: var(--accent); font-weight: 600; z-index: 1; }
  #stamp { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 14px 16px 60px; }

  h2.sect {
    font-size: 13px; margin: 24px 0 10px; color: var(--accent);
    border-bottom: 1px solid var(--line); padding-bottom: 5px;
  }
  h2.sect:first-child { margin-top: 0; }
  h2.sect .hint { color: var(--muted); font-weight: 400; font-size: 11px; margin-inline-start: 8px; }

  .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 14px; min-width: 128px; flex: 1 1 128px;
  }
  .card .k { font-size: 11.5px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 11px; color: var(--muted); }
  .card.hot .v { color: var(--accent); }

  .wrap { background: #fff; border: 1px solid var(--line); border-radius: 9px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 6px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--wash); font-weight: 600; color: var(--muted); font-size: 11.5px; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
  td.wide { white-space: normal; min-width: 150px; }
  tbody tr:hover { background: #fcfcfa; }
  td input { padding: 3px 6px; width: 82px; font-size: 12px; }
  td input.memo { width: 100%; min-width: 140px; }
  .tag {
    font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 5px; color: var(--muted); background: var(--wash);
  }
  .tag.live { border-color: var(--accent); color: var(--accent); }

  /* Time runs left to right even on an RTL page: an SVG is not mirrored, and a
     chart read the other way round confuses more than the consistency helps.
     Both ends carry their date, so it cannot be misread either way. */
  #chartBox { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 4px; }
  #chartBox svg { display: block; width: 100%; height: auto; }
  .axis { font-size: 9px; fill: var(--muted); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); padding: 2px 2px 6px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 4px; vertical-align: -1px; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; align-items: start; }
  .empty { color: var(--muted); padding: 22px 0; text-align: center; font-size: 12.5px; }
  .note {
    margin: 26px 0 0; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--muted); font-size: 11.5px;
  }
  #err { color: var(--warn); font-size: 12px; min-height: 1em; }
  @media (max-width: 620px) {
    header h1 { font-size: 14px; }
    main { padding: 12px 10px 50px; }
    .card { min-width: 104px; flex-basis: 104px; }
    .card .v { font-size: 18px; }
  }
</style>
</head>
<body>
  <header>
    <!-- This page loads no map code, so without this there is nothing here
         that leads back. First in the header, which in RTL is the start. -->
    <a id="backMap" href="/" title="العودة إلى الخريطة">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      الخريطة
    </a>
    <h1>الاستخدام</h1>
    <span class="spacer"></span>
    <span id="who" style="font-size:12px;color:var(--muted)"></span>
    <button id="signOut" type="button" hidden>خروج</button>
  </header>

  <div id="gate">
    <form id="signInForm">
      <h2>تسجيل الدخول</h2>
      <p>هذه الصفحة خاصة.</p>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="pass">كلمة المرور</label>
      <input id="pass" type="password" autocomplete="current-password" required />
      <button id="signInBtn" type="submit">دخول</button>
      <div id="gateErr"></div>
    </form>
  </div>

  <div id="app">
    <div id="controls">
      <div id="range"></div>
      <button id="refresh" type="button">تحديث</button>
      <button id="dump" type="button" title="كل الأرقام في ملف واحد">تنزيل JSON</button>
      <span class="spacer"></span>
      <span id="stamp"></span>
      <span id="err"></span>
    </div>
    <main id="out"></main>
  </div>

<script>
(() => {
  "use strict";
  // Through this site's own /api, same as the map and the laws page: the
  // Supabase key is a Worker secret and never reaches a browser.
  const API = "/api";
  const RANGES = [7, 30, 90, 365];
  // A minute is often enough for "who is on the site now" to be worth
  // watching, and only while the tab is actually in front -- a page left open
  // in a background tab for a week must not keep calling.
  const POLL_MS = 60000;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // The same session the map stores, so signing in on one signs in on all three.
  let session = null;
  try { session = JSON.parse(store.get("kwplots-session") || "null"); } catch {}

  async function authRpc(fn, payload, retried = false) {
    if (!session) throw new Error("not signed in");
    const res = await fetch(`${API}/rpc/${fn}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload ?? {}),
    });
    if (res.status === 401 && !retried && (await refresh())) return authRpc(fn, payload, true);
    if (!res.ok) throw new Error(`${fn} failed: ${res.status}`);
    if (res.status === 204) return null;
    return res.json().catch(() => null);
  }

  async function refresh() {
    if (!session?.refresh_token) return false;
    const res = await fetch(`${API}/auth/token?grant_type=refresh_token`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) { setSession(null); return false; }
    const b = await res.json();
    setSession({ access_token: b.access_token, refresh_token: b.refresh_token, email: b.user?.email ?? session.email });
    return true;
  }

  function setSession(s) {
    session = s;
    store.set("kwplots-session", s ? JSON.stringify(s) : "");
    paintAuth();
  }

  function paintAuth() {
    const inApp = !!session;
    $("gate").style.display = inApp ? "none" : "flex";
    $("app").style.display = inApp ? "flex" : "none";
    $("signOut").hidden = !inApp;
    $("who").textContent = session?.email ?? "";
  }

  $("signInForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("gateErr").textContent = "";
    try {
      const res = await fetch(`${API}/auth/token?grant_type=password`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value.trim(), password: $("pass").value }),
      });
      const b = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(b.error_description || b.msg || `HTTP ${res.status}`);
      setSession({ access_token: b.access_token, refresh_token: b.refresh_token, email: b.user?.email });
      $("pass").value = "";
      await load();
    } catch (err) { $("gateErr").textContent = err.message; }
  });

  $("signOut").addEventListener("click", () => {
    setSession(null);
    report = null;
    months = [];
  });

  // ---- names ---------------------------------------------------------------
  // What each recorded event is, in words. The names in the database are short
  // on purpose; this is the only place they are spelled out.
  const EVENTS = {
    session:         "زيارة",
    place:           "اختيار مدينة",
    lookup_hit:      "بحث برقم · وُجد",
    lookup_miss:     "بحث برقم · لم يُوجد",
    candidates:      "بحث برقم · نتائج متعددة",
    search_hit:      "بحث بالعنوان · وُجد",
    search_miss:     "بحث بالعنوان · لم يُوجد",
    blocks_empty:    "مدينة بلا قطع",
    setback:         "مسافة الشارع",
    measure:         "قياس",
    exact_dims:      "أبعاد دقيقة",
    print:           "طباعة",
    streetview:      "ستريت فيو",
    area_report:     "تقرير منطقة",
    draw_area:       "رسم منطقة",
    show_area:       "عرض منطقة",
    laws:            "أنظمة البناء",
    api_error:       "خطأ في الخدمة",
    rate_limited:    "تجاوز حد الطلبات",
  };
  const COUNTRIES = {
    KW: "الكويت", SA: "السعودية", AE: "الإمارات", QA: "قطر", BH: "البحرين",
    OM: "عمان", EG: "مصر", JO: "الأردن", LB: "لبنان", IQ: "العراق",
    SY: "سوريا", IN: "الهند", PK: "باكستان", PH: "الفلبين", BD: "بنغلاديش",
    GB: "بريطانيا", US: "الولايات المتحدة", DE: "ألمانيا", FR: "فرنسا",
    TR: "تركيا", CA: "كندا", NL: "هولندا", IE: "أيرلندا",
    "??": "غير معروف",
  };
  const DEVICES = { phone: "هاتف", tablet: "لوحي", desktop: "حاسب", unknown: "غير معروف" };
  const LANGS = { ar: "عربي", en: "إنجليزي", unknown: "غير معروف" };

  const evName = (k) => EVENTS[k] || k;
  const countryName = (c) => (COUNTRIES[c] ? `${COUNTRIES[c]} (${c})` : c);

  // Latin digits throughout. These numbers sit beside English-keyed codes and
  // get copied into spreadsheets; mixing numeral systems makes both worse.
  const nf = new Intl.NumberFormat("en-US");
  const fmt = (n) => (n == null ? "—" : nf.format(Number(n)));
  const pct = (n) => (n == null ? "—" : `${Number(n).toFixed(1)}%`);
  const day = (s) => String(s ?? "").slice(0, 10);
  const monthLabel = (s) => day(s).slice(0, 7);

  // ---- state ---------------------------------------------------------------
  let days = Number(store.get("kwplots-stats-days")) || 30;
  if (!RANGES.includes(days)) days = 30;
  let report = null;
  let months = [];
  let busy = false;

  function paintRange() {
    $("range").innerHTML = RANGES.map((d) =>
      `<button type="button" data-d="${d}" class="${d === days ? "active" : ""}">${d} يوم</button>`
    ).join("");
  }

  $("range").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]");
    if (!b) return;
    days = Number(b.dataset.d);
    store.set("kwplots-stats-days", String(days));
    paintRange();
    load();
  });

  $("refresh").addEventListener("click", () => load());

  // The monthly figures are frozen by a scheduled job in the Worker. Opening
  // this page calls the same function, so the freeze does not depend on the
  // schedule alone -- that is the one part of this whose failure is silent,
  // because the page goes on recomputing every month from the raw rows and a
  // trigger that never fired would only be discovered the day those rows
  // expired. The function returns immediately when both months were built in
  // the last six hours, so this usually costs one round trip, and only on the
  // first load rather than on every refresh.
  let rolled = false;
  async function rollUpOnce() {
    if (rolled) return;
    rolled = true;
    try {
      await authRpc("roll_up_recent", {});
    } catch { /* the report is still worth showing */ }
  }

  async function load() {
    if (busy) return;
    busy = true;
    $("err").textContent = "";
    try {
      await rollUpOnce();
      // The monthly series does not depend on the window, but it is small and
      // fetching both together keeps the page in one state rather than two.
      const [r, m] = await Promise.all([
        authRpc("usage_report", { p_days: days }),
        authRpc("usage_months", {}),
      ]);
      report = r;
      months = Array.isArray(m) ? m : [];
      render();
    } catch (err) {
      $("err").textContent = err.message;
    } finally {
      busy = false;
    }
  }

  // Only while the tab is in front, and load() itself refuses to overlap a
  // call already in flight.
  setInterval(() => {
    if (session && document.visibilityState === "visible") load();
  }, POLL_MS);

  // ---- the day chart -------------------------------------------------------
  // Days with no events do not come back from the report at all, and leaving
  // them out would draw a continuous line across a gap -- the one shape that
  // must not be invented here. So the window is filled in first and the zeros
  // are drawn as zeros.
  function chart(rows) {
    const have = new Map((rows || []).map((r) => [day(r.day), r]));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const series = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(today.getTime() - i * 86400000);
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const r = have.get(k);
      series.push({ day: k, visitors: r ? Number(r.visitors) : 0, sessions: r ? Number(r.sessions) : 0 });
    }

    const W = 720, H = 150, T = 8, B = 20, L = 32, R = 6;
    const top = Math.max(1, ...series.map((r) => Math.max(r.visitors, r.sessions)));
    const bw = (W - L - R) / series.length;
    const x = (i) => L + i * bw;
    const y = (v) => T + (H - T - B) * (1 - v / top);

    const bars = series.map((r, i) =>
      `<rect x="${(x(i) + bw * 0.12).toFixed(2)}" y="${y(r.visitors).toFixed(2)}" ` +
      `width="${Math.max(0.6, bw * 0.76).toFixed(2)}" height="${Math.max(0, H - B - y(r.visitors)).toFixed(2)}" ` +
      `fill="#3c6e47" fill-opacity="0.75">` +
      `<title>${r.day} · ${fmt(r.visitors)} زائر · ${fmt(r.sessions)} زيارة</title></rect>`
    ).join("");

    const line = series
      .map((r, i) => `${(x(i) + bw / 2).toFixed(2)},${y(r.sessions).toFixed(2)}`)
      .join(" ");

    const mid = Math.round(top / 2);
    const grid = [top, mid, 0]
      .filter((v, i, a) => a.indexOf(v) === i)
      .map((v) =>
        `<line x1="${L}" y1="${y(v).toFixed(2)}" x2="${W - R}" y2="${y(v).toFixed(2)}" stroke="#d9d5cb" stroke-width="1"/>` +
        `<text class="axis" x="${L - 4}" y="${(y(v) + 3).toFixed(2)}" text-anchor="end">${fmt(v)}</text>`
      ).join("");

    return `<div class="legend">` +
      `<span><i style="background:#3c6e47;opacity:.75"></i>زوار</span>` +
      `<span><i style="background:#8ab79a"></i>زيارات</span>` +
      `</div>` +
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">` +
      grid + bars +
      `<polyline points="${line}" fill="none" stroke="#8ab79a" stroke-width="1.4" shape-rendering="geometricPrecision"/>` +
      `<text class="axis" x="${L}" y="${H - 6}">${series[0].day}</text>` +
      `<text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${series[series.length - 1].day}</text>` +
      `</svg>`;
  }

  // ---- tables --------------------------------------------------------------
  function table(head, rows, note) {
    if (!rows.length) return `<div class="wrap"><div class="empty">${esc(note || "لا شيء بعد")}</div></div>`;
    return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  }

  // An object keyed by label, biggest first -- the small breakdowns.
  function pairs(obj, label) {
    return Object.entries(obj || {})
      .map(([k, v]) => [k, typeof v === "object" && v ? Number(v.n) : Number(v)])
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<tr><td>${esc(label(k))}</td><td class="n">${fmt(v)}</td></tr>`);
  }

  function card(k, v, s, hot) {
    return `<div class="card${hot ? " hot" : ""}"><div class="k">${esc(k)}</div>` +
      `<div class="v">${v}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}</div>`;
  }

  // Share of visitors from one country, or on one kind of device. Taken from
  // the same lists the tables below print, so a card and a table can never
  // disagree with each other.
  function shareOfList(list, code, total) {
    const row = (list || []).find((r) => r.country === code);
    if (!row || !total) return "—";
    return pct((100 * Number(row.visitors)) / Number(total));
  }
  function shareOfMap(obj, key, total) {
    const n = Number((obj || {})[key] || 0);
    if (!total) return "—";
    return pct((100 * n) / Number(total));
  }

  function monthsTable() {
    if (!months.length) return `<div class="wrap"><div class="empty">لا شهور بعد</div></div>`;
    const rows = months.slice().reverse().map((m) => {
      const cpv = m.cost_usd != null && m.visitors ? Number(m.cost_usd) / Number(m.visitors) : null;
      const ret = m.visitors ? (100 * Number(m.returning_visitors || 0)) / Number(m.visitors) : null;
      return `<tr>` +
        `<td>${esc(monthLabel(m.month))} ` +
        (m.live ? `<span class="tag live">جارٍ</span>` : `<span class="tag">محفوظ</span>`) +
        `</td>` +
        `<td class="n">${fmt(m.visitors)}</td>` +
        `<td class="n">${fmt(m.sessions)}</td>` +
        `<td class="n">${fmt(m.returning_visitors)}` +
        (ret == null ? "" : ` <span class="tag">${ret.toFixed(0)}%</span>`) + `</td>` +
        `<td class="n">${fmt(m.events)}</td>` +
        `<td class="n">${fmt(m.misses)}</td>` +
        `<td class="n">${pct(m.kuwait_pct)}</td>` +
        `<td class="n">${pct(m.mobile_pct)}</td>` +
        `<td class="n"><input type="number" step="0.01" min="0" data-m="${esc(day(m.month))}" ` +
          `value="${m.cost_usd == null ? "" : Number(m.cost_usd)}" placeholder="$" /></td>` +
        `<td class="n">${cpv == null ? "—" : `$${cpv.toFixed(3)}`}</td>` +
        `<td class="wide"><input class="memo" type="text" maxlength="200" data-note="${esc(day(m.month))}" ` +
          `value="${esc(m.note ?? "")}" placeholder="ملاحظة" /></td>` +
        `</tr>`;
    });
    return table(
      `<th>الشهر</th><th class="n">زوار</th><th class="n">زيارات</th>` +
      `<th class="n">عائدون</th><th class="n">أحداث</th><th class="n">بلا نتيجة</th>` +
      `<th class="n">الكويت</th><th class="n">هاتف</th>` +
      `<th class="n">التكلفة</th><th class="n">لكل زائر</th><th>ملاحظة</th>`,
      rows
    );
  }

  // The cost and the note are the only writable things on this page. Saved
  // when the field is left rather than on every keystroke, and the series is
  // re-read afterwards so what is on screen is what the database kept.
  function wireMonthInputs() {
    const save = async (month, usd, memo) => {
      $("err").textContent = "";
      try {
        await authRpc("set_month_cost", { m: month, usd, memo });
        months = (await authRpc("usage_months", {})) || months;
        render();
      } catch (err) { $("err").textContent = err.message; }
    };
    for (const el of $("out").querySelectorAll("input[data-m]")) {
      el.addEventListener("change", () => {
        const m = months.find((x) => day(x.month) === el.dataset.m);
        save(el.dataset.m, el.value === "" ? null : Number(el.value), m?.note ?? null);
      });
    }
    for (const el of $("out").querySelectorAll("input[data-note]")) {
      el.addEventListener("change", () => {
        const m = months.find((x) => day(x.month) === el.dataset.note);
        save(el.dataset.note, m?.cost_usd == null ? null : Number(m.cost_usd), el.value.trim() || null);
      });
    }
  }

  function missesTable() {
    const rows = (report.misses || []).map((r) =>
      `<tr>` +
      `<td>${esc(r.detail ?? "—")}</td>` +
      `<td>${esc(r.name_ar ?? (r.nbhood_no == null ? "—" : `${r.gov_no}/${r.nbhood_no}`))}</td>` +
      `<td>${esc(evName(r.kind))}</td>` +
      `<td class="n">${fmt(r.n)}</td>` +
      `</tr>`);
    return table(
      `<th>ما كُتب</th><th>المدينة</th><th>النوع</th><th class="n">مرات</th>`,
      rows,
      "لم يفشل بحث واحد في هذه المدة"
    );
  }

  function placesTable() {
    const rows = (report.places || []).map((r) =>
      `<tr>` +
      `<td>${esc(r.name_ar ?? "—")}</td>` +
      `<td>${esc(r.name_en ?? "")}</td>` +
      `<td class="n">${fmt(r.n)}</td>` +
      `<td class="n">${fmt(r.visitors)}</td>` +
      `</tr>`);
    return table(`<th>المدينة</th><th>English</th><th class="n">مرات</th><th class="n">زوار</th>`, rows);
  }

  function render() {
    if (!report) { $("out").innerHTML = `<div class="empty">…</div>`; return; }
    const w = report.window || {};
    const live = report.live || {};
    let html = "";

    html += `<h2 class="sect">الآن<span class="hint">زوار مميزون</span></h2>`;
    html += `<div class="cards">` +
      card("آخر ٥ دقائق", fmt(live.last_5_min), "", true) +
      card("آخر ساعة", fmt(live.last_hour)) +
      card("اليوم", fmt(live.today)) +
      `</div>`;

    // Stated rather than silent. The figures leave out every browser that has
    // ever signed in, which is the owner's own; saying how much was left out
    // is what makes that an exclusion rather than a discrepancy.
    const ex = report.excluded || {};
    const exNote = Number(ex.visitors) > 0
      ? `<span class="hint">بدون زياراتك: ${fmt(ex.sessions)} زيارة، ${fmt(ex.events)} حدث</span>`
      : "";
    html += `<h2 class="sect">آخر ${days} يوم${exNote}</h2>`;
    html += `<div class="cards">` +
      card("زوار", fmt(w.visitors)) +
      card("زيارات", fmt(w.sessions), `${fmt(w.sessions_per_visitor)} لكل زائر`) +
      card("أحداث", fmt(w.events)) +
      card("من الكويت", shareOfList(report.countries, "KW", w.visitors)) +
      card("من الهاتف", shareOfMap(report.devices, "phone", w.visitors)) +
      `</div>`;

    html += `<h2 class="sect">يوماً بيوم</h2>`;
    html += `<div id="chartBox">${chart(report.by_day)}</div>`;

    html += `<h2 class="sect">شهراً بشهر` +
      `<span class="hint">محفوظ دائماً · التكلفة والملاحظة تُكتبان هنا</span></h2>`;
    html += monthsTable();

    html += `<h2 class="sect">بحث لم يجد شيئاً` +
      `<span class="hint">كل سطر إمّا نقص في البيانات أو نقص في قراءة الرقم</span></h2>`;
    html += missesTable();

    html += `<h2 class="sect">المدن الأكثر طلباً</h2>`;
    html += placesTable();

    html += `<h2 class="sect">الأدوات</h2>`;
    html += table(
      `<th>الحدث</th><th class="n">مرات</th><th class="n">زوار</th>`,
      Object.entries(report.features || {})
        .sort((a, b) => Number(b[1].n) - Number(a[1].n))
        .map(([k, v]) =>
          `<tr><td>${esc(evName(k))}</td><td class="n">${fmt(v.n)}</td><td class="n">${fmt(v.visitors)}</td></tr>`)
    );

    html += `<h2 class="sect">من أين</h2>`;
    html += `<div class="cols">` +
      table(`<th>الدولة</th><th class="n">زوار</th>`,
        (report.countries || []).map((r) =>
          `<tr><td>${esc(countryName(r.country))}</td><td class="n">${fmt(r.visitors)}</td></tr>`)) +
      table(`<th>المدينة</th><th class="n">زوار</th>`,
        (report.cities || []).map((r) =>
          `<tr><td>${esc(r.city)}</td><td class="n">${fmt(r.visitors)}</td></tr>`)) +
      table(`<th>الوصول</th><th class="n">زيارات</th>`,
        (report.referrers || []).map((r) =>
          `<tr><td>${esc(r.referrer === "direct" ? "مباشر" : r.referrer)}</td><td class="n">${fmt(r.sessions)}</td></tr>`)) +
      table(`<th>الجهاز</th><th class="n">زوار</th>`, pairs(report.devices, (k) => DEVICES[k] || k)) +
      table(`<th>اللغة</th><th class="n">زيارات</th>`, pairs(report.languages, (k) => LANGS[k] || k)) +
      `</div>`;

    html += `<p class="note">لا تحتوي هذه الأرقام على ما يعرّف شخصاً: لا عنوان IP، ` +
      `ومعرّف الزائر نصّ عشوائي يصنعه المتصفح لنفسه، والمدينة هي المدينة التي ` +
      `تحددها شبكة كلاودفلير لا عنوان أحد. الأحداث الخام تُحفظ ٤٠٠ يوم ثم تُحذف، ` +
      `وتبقى الأرقام الشهرية.</p>`;
    html += `<p class="note">آخر قراءة: ${esc(new Date(report.generated_at).toLocaleString("ar-KW"))}</p>`;

    $("out").innerHTML = html;
    $("stamp").textContent = `${fmt(w.visitors)} زائر / ${days} يوم`;
    wireMonthInputs();
  }

  // Everything on screen, in one file. The monthly series is the part worth
  // keeping a copy of outside the database.
  $("dump").addEventListener("click", () => {
    const blob = new Blob(
      [JSON.stringify({ exported_at: new Date().toISOString(), days, months, report }, null, 2)],
      { type: "application/json" }
    );
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `kuwaitplot-usage-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  paintAuth();
  paintRange();
  if (session) load();
})();
</script>
</body>
</html>
